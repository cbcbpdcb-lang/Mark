<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EchoRank｜AI 回答事实审计</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   【改这里 01】配色与字体（v3 看板风格）
   ========================================================= */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#1B1F2A; --muted:#6B7080; --faint:#9CA1AE;
  --rule:#E6E8EF; --rule-soft:#EEF0F5;
  --accent:#4C5BD4; --accent-ink:#FFFFFF; --accent-soft:#EEF0FF; --accent-2:#8B96EC; --accent-3:#C7CCF7; --accent-4:#E3E6FB;
  --ok:#1F8A5B; --ok-soft:#E6F6EE; --warn:#B7791F; --warn-soft:#FFF4DF; --bad:#D14343; --bad-soft:#FDECEC;
  --shadow:0 1px 2px rgba(20,24,40,.04),0 4px 16px rgba(20,24,40,.04);
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --serif:var(--sans);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121420; --surface:#1A1D2B; --surface-2:#20243A; --ink:#E8EAF2; --muted:#A3A8B8; --faint:#6C7184;
    --rule:#2A2F44; --rule-soft:#232739; --accent:#8A96F0; --accent-ink:#0F1220; --accent-soft:#252A4A; --accent-2:#5F6BD8; --accent-3:#3A4280; --accent-4:#2A3060;
    --ok:#6CCF9C; --ok-soft:#1B2E26; --warn:#E0B26A; --warn-soft:#33291A; --bad:#EF8A8A; --bad-soft:#3A2323; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121420; --surface:#1A1D2B; --surface-2:#20243A; --ink:#E8EAF2; --muted:#A3A8B8; --faint:#6C7184;
  --rule:#2A2F44; --rule-soft:#232739; --accent:#8A96F0; --accent-ink:#0F1220; --accent-soft:#252A4A; --accent-2:#5F6BD8; --accent-3:#3A4280; --accent-4:#2A3060;
  --ok:#6CCF9C; --ok-soft:#1B2E26; --warn:#E0B26A; --warn-soft:#33291A; --bad:#EF8A8A; --bad-soft:#3A2323; --shadow:none;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main:focus,.main:focus-visible{outline:none}

/* ---------- 框架 ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;padding:20px;min-height:100vh}
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px;font-weight:700;font-size:18px;letter-spacing:.01em}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;font-weight:700}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.pcard{border:1px solid var(--rule);background:var(--surface-2);border-radius:12px;padding:12px}
.pcard .pname{display:flex;align-items:center;gap:10px;font-weight:600}
.pcard .pava{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.pcard .pmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.nav{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.nav .grp{font-size:12px;color:var(--faint);padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;display:block;padding:8px 12px;border-radius:9px;color:var(--muted);font-size:14px}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.ws{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:auto;padding:0 6px}
.ws b{font-weight:500;color:var(--ink)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;color:var(--ink);user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--rule);position:relative;cursor:pointer;margin:0;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:16px}

.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.topbar{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topbar .crumb{font-weight:600;font-size:15px}
.topbar .crumb span{color:var(--faint);font-weight:400}
.ph{padding:6px 6px 0}
.ph h1{font-weight:700;font-size:24px;line-height:1.35;margin:0 0 6px;letter-spacing:.005em}
.lede{color:var(--muted);font-size:14px;max-width:70ch;margin:0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px}
.card>h2:first-child{margin-top:0}
h2{font-weight:600;font-size:16px;line-height:1.4;margin:0 0 14px}
h3{font-weight:600;font-size:14.5px;margin:22px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

/* ---------- KPI 卡片 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.kpi .kt{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .kt i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.kpi .kv{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.kpi .kv small{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.kpi .ks{font-size:12.5px;color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px}
.stmt{font-weight:600;font-size:clamp(18px,2.2vw,23px);line-height:1.5;max-width:40em;margin:0 0 8px}
.stmt-sub{color:var(--muted);max-width:70ch;font-size:13.5px;margin:0}

/* ---------- 讲解旁注 ---------- */
.note{display:none;border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;margin:14px 0 4px;font-size:13px;line-height:1.75;max-width:78ch;border-radius:0 8px 8px 0}
.note b{font-weight:600}
body.learn .note{display:block}

/* ---------- 表格 ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:left;background:var(--surface-2);padding:10px 12px;white-space:nowrap}
.tbl th:first-child{border-radius:10px 0 0 10px} .tbl th:last-child{border-radius:0 10px 10px 0}
.tbl td{border-bottom:1px solid var(--rule-soft);padding:12px 12px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.wide{min-width:240px}
.stage{white-space:nowrap;color:var(--muted);font-size:12.5px}

/* ---------- 热力矩阵 ---------- */
.matrix td{padding-top:8px;padding-bottom:8px}
.cells{display:flex;gap:5px;align-items:center}
.cell{all:unset;box-sizing:border-box;width:26px;height:22px;border-radius:6px;border:1.5px solid var(--rule);cursor:pointer;flex:none}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cell.v{background:var(--accent);border-color:var(--accent)}
.cell.m{background:var(--warn-soft);border-color:var(--warn)}
.cell.n{background:var(--rule-soft);border-color:var(--rule-soft)}
.cell.f{background:var(--bad);border-color:var(--bad)}
.cell.t{background:repeating-linear-gradient(45deg,var(--rule) 0 2px,transparent 2px 6px);border-color:var(--rule)}
.cell.e{border-style:dashed;cursor:default}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .cell{width:14px;height:12px;cursor:default}
.heat{display:inline-block;min-width:54px;text-align:center;padding:5px 8px;border-radius:8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:13px}
.bar .track{height:12px;border-radius:6px;background:var(--rule-soft);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--accent-2)}
.bar.me .fill{background:var(--accent)}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ---------- 标签、按钮 ---------- */
.tag{display:inline-block;font-size:12px;line-height:1.6;padding:1px 8px;border-radius:999px;background:var(--rule-soft);color:var(--muted);white-space:nowrap;margin:0 4px 4px 0}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.btn{font-size:13.5px;line-height:1.4;padding:8px 16px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding-left:6px;padding-right:6px}
.btn.quiet:hover{color:var(--accent);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:12.5px;padding:4px 10px;border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-size:13px;color:var(--muted);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cred{display:inline-block;font-size:12px;line-height:1.6;padding:1px 8px;border-radius:999px;white-space:nowrap;margin:2px 4px 2px 0;border:1px solid transparent}
.cred.ok{background:var(--ok-soft);color:var(--ok)}
.cred.dir{background:var(--warn-soft);color:var(--warn)}
.cred.no{background:var(--bad-soft);color:var(--bad)}
.cred.mock{background:transparent;border-color:var(--rule);color:var(--muted)}

/* ---------- 状态条 ---------- */
.state{border:1px solid var(--rule);border-left:4px solid var(--warn);background:var(--surface);padding:16px 20px;border-radius:12px;margin:0 0 14px;max-width:820px}
.state.bad{border-left-color:var(--bad)} .state.ok{border-left-color:var(--ok)} .state.info{border-left-color:var(--accent)}
.state h4{font-size:15px;font-weight:600;margin:0 0 4px}
.state p{color:var(--muted);margin:0 0 10px} .state p:last-child{margin-bottom:0}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13.5px;max-width:min(560px,90vw);z-index:10}

/* ---------- 表单 ---------- */
.field{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 18px;padding:11px 0;border-bottom:1px solid var(--rule-soft);align-items:start}
.field>label{color:var(--muted);font-size:13px;padding-top:7px}
.inp,.sel,textarea.inp{width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13.5px;line-height:1.5}
.inp:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.sm{padding:4px 8px;font-size:12.5px;border-radius:8px}
textarea.inp{resize:vertical;min-height:70px}
.hint{font-size:12.5px;color:var(--faint);margin-top:4px}
.editor{border:1px solid var(--rule);background:var(--surface-2);border-radius:12px;padding:18px 20px;margin:14px 0}
.links{margin:4px 0 2px 0;font-size:12px;color:var(--muted)}
.links a{color:var(--accent);text-decoration:none;cursor:pointer} .links a:hover{text-decoration:underline}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);word-break:break-all} .linkbtn:hover{text-decoration:underline} .linkbtn:focus-visible{outline:2px solid var(--accent)}
.reasons{margin:4px 0 0;padding-left:1.1em;font-size:12px;color:var(--muted)} .reasons li{margin:2px 0}
.cand{border:1px solid var(--rule);border-radius:12px;background:var(--surface);padding:14px 16px;margin:10px 0}
.cand.bad{border-left:3px solid var(--bad)} .cand.done{opacity:.6}
.cand .quote{font-size:13px;color:var(--muted);border-left:2px solid var(--rule);padding-left:10px;margin:8px 0}
.cand label.small{display:block;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srcrow td{background:var(--surface-2)}
input[type=file]{font-size:13px}

/* ---------- 运行结果 ---------- */
.runs-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px}
.qlist{list-style:none;margin:0;padding:0;font-size:13.5px}
.qlist li button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:8px 10px;border-radius:9px;color:var(--muted);line-height:1.5}
.qlist li button:hover{color:var(--ink);background:var(--surface-2)}
.qlist li button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.qlist li button:focus-visible{outline:2px solid var(--accent)}
.qlist .grp{font-size:12px;color:var(--faint);padding:14px 10px 4px} .qlist .grp:first-child{padding-top:0}
.qhead{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:20px}
.col h3{margin:0 0 4px}
.resp{background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-top:12px}
.resp .meta{font-size:12px;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.resp .txt{font-size:13.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow-y:auto;background:var(--surface);border-radius:8px;padding:10px 12px}
.resp .eval{border-top:1px solid var(--rule);margin-top:12px;padding-top:10px;font-size:13px}
.resp .eval dl{display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 12px;margin:0}
.resp .eval dt{color:var(--muted)} .resp .eval dd{margin:0}
.resp.timeout{border-style:dashed;background:transparent}
.review{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
mark{color:inherit;border-radius:3px;padding:0 1px}
mark.k-brand{background:var(--accent-soft)}
mark.k-bad{background:var(--bad-soft);text-decoration:underline;text-decoration-color:var(--bad);text-underline-offset:3px}
mark.k-warn{background:var(--warn-soft)} mark.k-ok{background:var(--ok-soft)}
.cond td{padding-top:8px;padding-bottom:8px}

/* ---------- 学习手册 ---------- */
.lesson{padding:22px 0;border-bottom:1px solid var(--rule-soft)} .lesson:last-child{border-bottom:0}
.lesson h3{margin-top:0;font-size:15.5px}
.lesson dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 20px;margin:12px 0 0;max-width:880px}
.lesson dt{color:var(--muted);font-size:13px;padding-top:1px} .lesson dd{margin:0}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88em;background:var(--rule-soft);padding:1px 5px;border-radius:4px}
.tasks{list-style:none;padding:0;margin:0;max-width:820px}
.tasks li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.tasks input{width:17px;height:17px;margin-top:4px;accent-color:var(--accent)}
.tasks li.done .t{color:var(--faint);text-decoration:line-through}
.prose{max-width:74ch} .prose ul{padding-left:1.2em;margin:0 0 10px} .prose li{margin-bottom:6px}

@media (max-width: 900px){
  .app{grid-template-columns:1fr;padding:12px;gap:12px}
  .side{position:static;height:auto;padding:14px;gap:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px} .nav .grp{display:none}
  .nav button{white-space:nowrap}
  .ws{display:none}
  .runs-layout{grid-template-columns:1fr;gap:16px}
  .field{grid-template-columns:1fr;gap:4px} .field>label{padding-top:0}
  .lesson dl{grid-template-columns:1fr;gap:2px} .lesson dt{margin-top:10px}
  .grid2{grid-template-columns:1fr}
  .bar{grid-template-columns:96px minmax(0,1fr) 56px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="flash" class="flash" hidden></div>

<script>
/* =========================================================
   EchoRank v2 —— 单文件版本
   v2 新增：测量可信度、错误溯源、事实底账导入、国产模型数据导入
   代码里用【改这里 01】到【改这里 14】标出所有值得改的位置。
   ========================================================= */

const TODAY = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();

/* ---------- 【改这里 02】产品事实库的默认值（虚构产品 NovaNote） ---------- */
const DEFAULT_TRUTH = {
  product_id: 'nova_note',
  entity_name: 'NovaNote',
  aliases: ['NovaNote', 'Nova Note', '诺瓦笔记'],
  category: 'AI 会议助手',
  positioning: '面向中小团队的会议知识工作台',
  target_users: ['产品团队', '销售团队', '10–200 人团队'],
  official_domains: ['novanote.example'],
  positioning_match: { aligned: '中小团队|小团队|初创团队|会议知识工作台', deviation: '大型企业|企业级|英文会议摘要' },
  capabilities: [
    { claim_id: 'cap_transcribe',   statement: '会议录音实时转写',           match: '实时转写|转写|转成文字', status: 'VERIFIED', valid_from: '2025-03-01', evidence_url: 'https://novanote.example/features' },

比如在用飞书还是企业微信），我可以帮你设计一个更具体的落地方案或会议笔记模板。", "latency_ms": 71506, "input_tokens": 103, "output_tokens": 2124, "started_at": "2026-09-24 15:14", "error": null}, {"run_id": "API-20260924-1511-kimi-q_aw_02-2", "engine": "kimi", "query_id": "q_aw_02", "repeat": 2, "model": "kimi-k3", "temperature": 1.0, "status": "SUCCESS", "raw": "核心思路先说清楚：**可搜索的关键不在搜索工具，而在沉淀时的结构**。垃圾进垃圾出，所以功夫要下在信息产生的那一刻（也就是会议本身）。建议这样做：\n\n## 1. 定一个唯一的家\n\n选一个工具作为唯一知识库（飞书、语雀、Notion、钉钉文档都行），规定所有会议产出必须落在这里。比选哪个工具更重要的是：别再散落在微信群聊、个人备忘录和口头传达里。\n\n## 2. 会议纪要模板化\n\n固定结构即可，不用复杂：\n\n- 日期 / 参会人 / 议题\n- **结论**（定了什么）\n- **行动项**（谁、做什么、截止时间）\n- 标题统一格式：`2025-01-15 增长复盘会`\n\n**关键动作**：会议最后留 5 分钟，当场口头过一遍结论和行动项，记录人当场确认。纪要质量在这一刻就定了，事后补的纪要基本没人写。\n\n## 3. 用 AI 把记录成本降到接近零\n\n飞书妙记、通义听悟、讯飞听见这类工具可以自动转写并生成摘要，人只需做一件事：核对确认\"决策\"和\"行动项\"。原始转写全文自动存档，作为搜索的兜底。结构化纪要 + AI 问答（如飞书知识问答、Notion AI）组合起来，直接自然语言提问就能查。\n\n## 4. 单独维护一份\"决策日志\"\n\n团队搜索最高频的问题其实是\"**我们当时为什么这么定**\"。用一个简单表格持续记录：\n\n| 日期 | 决策 | 原因 | 决策人 | 相关纪要链接 |\n|---|---|---|---|---|\n\n这是投入产出比最高的一个习惯，几分钟维护，省下无数次翻记录。\n\n## 5. 每周 30 分钟做\"升级\"，而不是全量归档\n\n不是每份纪要都值得进知识库。把反复被用到的内容提炼成项目主页、SOP、FAQ；原始纪要保留不动，知识页放链接跳转，不要复制粘贴（否则两处不同步）。\n\n## 几个坑提前说\n\n- **别追求完美的分类体系**——会死于没人维护，扁平 + 好标题 + 全文搜索就够了\n- **别把记录依赖个人自觉**——要嵌进流程：固定轮流记录人，或直接交给 AI\n- **知识库只进不出会变成坟墓**——定期看看哪些文档已过时\n\n**最小启动方案**：一个工具 + 一个纪要模板 + 一份决策日志。跑顺一个月，再考虑加别的。\n\n需要的话，我可以帮你写一个具体的会议纪要模板，或者按你们用的工具给个落地方案。", "latency_ms": 89488, "input_tokens": 103, "output_tokens": 2635, "started_at": "2026-09-24 15:15", "error": null}, {"run_id": "API-20260924-1511-kimi-q_aw_03-1", "engine": "kimi", "query_id": "q_aw_03", "repeat": 1, "model": "kimi-k3", "temperature": 1.0, "status": "SUCCESS", "raw": "中日英混说确实是语音识别里比较难的场景（尤其是同一句话里夹杂外语词），目前没有完全完美的工具，但以下几个对多语种混合支持得相对不错：\n\n**推荐工具**\n\n- **Notta**：日资背景，日语识别准确率在同类里领先，支持中日英等50多种语言，可以直接接入 Zoom / Teams / Google Meet 实时转写，在日本商务场景用得很多\n- **飞书妙记 / Lark Minutes**：支持中日英三种语言识别，会议录音自动生成文字稿，还能区分发言人\n- **通义听悟**：阿里出品，支持中日英实时转写和翻译，中文处理能力强\n- **讯飞听见**：中文识别最强，多语种混合场景也支持，但日语准确率略逊于Notta\n- **Whisper（OpenAI开源模型）**：多语言能力很强，可以通过 M epeat": 1, "model": "deepseek-flash", "temperature": 0.7, "status": "SUCCESS", "raw": "小团队会议多、信息散，确实是个很典型的痛点。核心问题通常不是「没有记录」，而是**记录分散、格式不统一、没有统一入口**。下面给你一套可以直接落地的方案，从轻到重分三层。\n\n## 一、先定一个「唯一真相源」\n\n最关键的一步：**所有会议产出必须汇到一个地方**，而不是散在飞书/微信/Notion/邮件里。\n\n推荐选一个团队已经在用的工具作为唯一入口：\n\n| 工具 | 适合场景 |\n|------|---------|\n| Notion / 飞书知识库 | 小团队首选，块级编辑+搜索强 |\n| 语雀 | 国内团队，文档结构清晰 |\n| Obsidian + Git | 技术团队，本地+可版本控制 |\n| Confluence | 稍大团队，但小团队偏重 |\n\n**规则**：会议纪要只写在这里，其他地方只发链接。\n\n## 二、统一会议纪要模板（这是能搜索的前提）\n\n散乱的信息没法搜索，是因为没有结构化。用一个固定模板：\n\n```\n# [日期] [会议名]\n## 参会人\n## 结论（Decision）\n- 一句话一条，可被搜索\n## 待办（Action Items）\n- [ ] 事项 @负责人 截止日期\n## 讨论要点（Context）\n- 关键背景，方便日后回溯\n## 相关链接\n```\n\n**关键点**：\n- 「结论」和「待办」单独成块，未来搜索时命中率最高\n- 每条待办带 `@人名` 和日期，方便按人/时间过滤\n- 讨论要点不用逐字记录，只记「为什么这么决定」\n\n## 三、让信息可被搜索的三个层次\n\n**层次1：工具自带搜索（0成本）**\nNotion/飞书/语雀的全文搜索已经够用，前提是**标题规范**：\n- 标题格式：`2025-01-15 产品周会`\n- 统一用 `YYYY-MM-DD`，方便按时间排序和搜索\n\n**层次2：标签体系（低成本，强烈推荐）**\n给每篇纪要打 2-4 个标签：\n- 项目标签：`#项目A` `#项目B`\n- 类型标签：`#决策` `#复盘` `#需求评审`\n- 状态标签：`#进行中` `#已归档`\n\n这样搜 `#项目A #决策` 就能拉出所有相关决策。\n\n**层次3：AI 检索（进阶）**\n如果团队用 Notion/飞书，可以直接接 AI：\n- Notion AI / 飞书智能伙伴：直接问「上周关于X的结论是什么」\n- 或者把所有纪要导出，喂给一个 RAG 工具（如 Dify、FastGPT），做成团队内部问答机器人\n\n## 四、减少会议本身的三个动作\n\n信息沉淀的根源是会议太多。可以同步做：\n\n1. **能异步的不开会**：周报、进度同步用文档代替\n2. **会议必须有产出**：没有结论和待办的会，等于没开\n3. **指定记录人**：每次会轮值，会后 24h 内必须归档\n\n## 五、一个最小可执行版本\n\n如果只想先动起来：\n\n1. 建一个 Notion/飞书页面叫「会议纪要」\n2. 用上面的模板，每次会新建子页面，标题 `YYYY-MM-DD 会议名`\n3. 会后 24h 内，记录人填完「结论+待办」\n4. 每月底花 30 分钟，把已完成的打上 `#已归档`\n\n坚持一个月，你就会有一个可搜索的团队记忆库。\n\n---\n\n需要的话，我可以帮你：\n- 写一个具体的 Notion/飞书模板（可直接复制）\n- 设计一套标签体系（按你们团队的项目结构）\n- 或者给一个用 AI 做会议纪要自动归档的方案\n\n你们团队现在主要用什么工具？我可以给更具体的建议。", "latency_ms": 5230, "input_tokens": 23, "output_tokens": 853, "started_at": "2026-09-24 23:13", "error": null}, {"run_id": "API-20260924-2312-deepseek-q_aw_02-2", "engine": "deepseek", "query_id": "q_aw_02", "repeat": 2, "model": "deepseek-flash", "temperature": 0.7, "status": "SUCCESS", "raw": "小团队会议多、信息散落，本质问题是：**没有把“会议产出”变成“结构化知识”的固定流程**。下面给你一套可以直接落地的方案，从流程、工具到习惯，尽量轻量。\n\n---\n\n## 一、先解决“沉淀什么”\n\n会议信息其实分四类，处理方式完全不同：\n\n| 类型 | 例子 | 处理方式 |\n|---|---|---|\n| 决策 | “我们决定用方案B” | 必须沉淀，进决策日志 |\n| 待办 | “小王周五前出原型” | 进任务系统，不进知识库 |\n| 背景/讨论 | 为什么选B不选A | 沉淀，进会议纪要 |\n| 闲聊/过程 | 中途的争论 | 不沉淀 |\n\n**关键原则：只有“决策 + 为什么”值得进知识库，待办进任务工具，其余丢弃。** 否则知识库会被噪音淹没。\n\n---\n\n## 二、最小可行流程（每周固定动作）\n\n### 1. 会前：一个模板\n所有会议共用一个纪要模板，放在固定位置（如飞书/Notion 模板）：\n\n```\n# 会议主题 + 日期\n## 结论（1-3条，必须写）\n## 关键讨论（为什么这么决定）\n## 待办（谁 / 什么 / 何时）\n## 相关链接\n```\n\n### 2. 会中：指定一个“记录人”\n轮流担任，但必须有。记录人只记**结论和待办**，不记流水账。\n\n### 3. 会后 24 小时内：归档到唯一入口\n- 纪要 → 统一放进**一个知识库**（Notion / 飞书知识库 / Obsidian / 语雀都行）\n- 待办 → 同步到任务工具（飞书任务 / Todoist / Linear）\n- **不要**让纪要散在群聊、邮件、文档各处\n\n### 4. 每周五：15 分钟“知识整理”\n一个人负责把本周所有纪要：\n- 打标签（项目名 / 主题）\n- 把重复出现的决策合并成一条“定论”\n- 删掉纯过程记录\n\n---\n\n## 三、让知识“可搜索”的关键\n\n光有文档不够，要能被搜到：\n\n1. **统一命名规范**\n   `2024-06-14 产品周会 - 支付流程改版`\n   日期 + 会议类型 + 主题，搜索时一眼能找到。\n\n2. **标签体系（别超过 10 个）**\n   按项目或主题打标签，例如 `#支付` `#增长` `#技术架构`。标签太多等于没有。\n\n3. **建一个“决策日志”页面**\n   所有重要决策汇总成一张表：\n\n   | 日期 | 决策 | 原因 | 相关会议 |\n   |---|---|---|---|\n   这是最常被搜的东西。\n\n4. **用支持全文搜索的工具**\n   Notion、飞书、语雀、Obsidian 都行。关键是**所有内容在一个工具里**，不要一半在微信一半在文档。\n\n---\n\n## 四、工具组合推荐（按团队规模）\n\n**3-5 人小团队，最轻方案：**\n- 飞书 / 钉钉：群 + 文档 + 任务一体，会议纪要直接建文档，待办直接转任务\n- 或 Notion：一个数据库管所有会议纪要，一个看板管待办\n\n**想更极客：**\n- Obsidian + 微信/飞书导出 → 本地 Markdown，全文搜索极快，但需要有人维护\n\n**核心不是工具，是“所有会议纪要只进一个地方”。**\n\n---\n\n## 五、让习惯落地的 3 个技巧\n\n1. **会议结束前 2 分钟，当场念结论和待办**，确认无误再散会。避免会后扯皮。\n2. **把“有没有纪要”作为会议是否有效的标准**——没纪要的会等于没开。\n3. **每周例会上花 1 分钟展示“本周知识库新增”**，让大家知道东西在哪、能搜到什么。\n\n---\n\n## 六、一个反直觉的建议\n\n**不要试图沉淀所有会议。** 小团队会议多，如果每个都详细记录，维护成本会压垮知识库。\n\n更好的做法是：\n- **只对“决策型会议”做完整纪要**（周会、评审会、复盘会）\n- **同步型会议**（站会、进度同步）只留一句结论或直接不留\n- 把省下的时间用来把**重要决策**写清楚\n\n---\n\n如果你告诉我你们现在用什么工具（飞书/Notion/微信/钉钉）、大概几个人、会议类型主要有哪些，我可以给你一套更具体的模板和归档结构。", "latency_ms": 6059, "input_tokens": 23, "output_tokens": 1019, "started_at": "2026-09-24 23:13", "error": null}, {"run_id": "API-20260924-2312-deepseek-q_aw_03-1", "engine": "deepseek", "query_id": "q_aw_03", "repeat": 1, "mode n## 基本要求\n\n1. **年龄要求**：通常需年满18岁\n2. **推荐人**：需要有一位现有的多特瑞会员作为推荐人（介绍人）\n3. **购买入门套组**：通常需要购买一个入门套组才能激活会员资格\n\n## 会员类型\n\n**消费者会员**\n- 享受会员价购买产品（通常比零售价低约25%）\n- 无每月最低消费要求\n- 不能获得佣金或奖金\n\n**经销商会员**\n- 除享受会员价外，还可通过推荐他人和发展团队获得佣金\n- 通常有每月最低消费要求（如100 PV，具体因地区而异）\n- 需要遵守公司的合规政策\n\n## 各地区的差异\n\n不同国家和地区的具体要求可能有所不同，例如：\n- **中国大陆**：需要通过官方渠道或授权经销商办理，可能有特定的入会套组\n- **美国**：可直接在线注册，购买入门套组即可\n- **台湾/香港**：有各自的入会方案\n\n## 建议\n\n由于政策和入会套组会不定期调整，建议你：\n1. 直接联系一位多特瑞会员了解最新入会方案\n2. 访问多特瑞在你所在地区的官方网站查询\n3. 确认你所在地区是否有直销牌照等相关合规要求\n\n如果你告诉我你所在的地区，我可以给你更具体的建议。", "latency_ms": 2127, "input_tokens": 12, "output_tokens": 311, "started_at": "2026-09-25 19:50"}, {"run_id": "API-20260925-1945-deepseek-q_jo_04-2", "engine": "deepseek", "query_id": "q_jo_04", "repeat": 2, "model": "deepseek-flash", "temperature": 0.7, "status": "SUCCESS", "raw": "成为多特瑞会员的要求比较简单，主要分为**消费者会员**和**经营者会员**两种类型。以下是具体要求：\n\n## 基本条件\n\n1. **年龄要求**：年满18周岁\n2. **推荐人**：需要有一位现有的多特瑞会员作为推荐人（介绍人）\n3. **购买入门套装**：通常需要购买一个入门套装（如健康套装、家庭 essentials 套装等），不同时期和地区的套装内容与价格可能不同\n\n## 会员类型\n\n### 消费者会员（优惠顾客）\n- 主要目的是以会员价购买产品自用\n- 享受零售价约**75折**左右的优惠\n- 无每月最低消费要求（但保持活跃可能有额外好处）\n\n### 经营者会员（IPC/商业会员）\n- 有意愿分享产品或经营事业\n- 需要申请并可能提供相关证件\n- 需遵守公司的经营政策和道德规范\n- 有资格获得奖金和佣金\n\n## 其他要求\n\n- **遵守公司政策**：同意并遵守多特瑞的《会员协议》和《政策与程序》\n- **提供真实信息**：姓名、联系方式、地址等\n- **部分地区**可能需要提供身份证件验证\n\n## 注意事项\n\n- 不同国家/地区的具体规定可能略有差异\n- 建议直接咨询推荐人或访问多特瑞官方网站了解最新入会政策\n- 入会通常没有强制性的每月消费要求，但保持一定消费可维持会员活跃状态\n\n如果你有具体的推荐人，直接联系他们获取最新的入会链接和套装信息是最便捷的方式。", "latency_ms": 2345, "input_tokens": 12, "output_tokens": 330, "started_at": "2026-09-25 19:50"}, {"run_id": "API-20260925-1945-deepseek-q_jo_05-1", "engine": "deepseek", "query_id": "q_jo_05", "repeat": 1, "model": "deepseek-flash", "temperature": 0.7, "status": "SUCCESS", "raw": "关于做多特瑞（dōTERRA）经销商能否赚钱，简单来说：**有人确实赚到了钱，但对绝大多数人来说，很难赚到可观的收入，甚至可能亏钱。**\n\n这需要从商业模式、收入结构、市场环境以及个人投入等多个角度来客观分析。\n\n### 1. 商业模式：直销/多层次分销\n多特瑞采用的是直销模式，和安利、如新等类似。经销商的收入主要来自：\n\n- **零售差价**：以优惠价进货，再以零售价卖出。\n- **团队计酬**：发展下线，从下线的销售业绩中提取一定比例的奖金。\n- **各种奖金制度**：如快速启动奖金、领导奖、汽车奖等。\n\n这种模式的特点是：**收入高度集中在顶层**。根据美国联邦贸易委员会（FTC）和多地消费者组织的调查，绝大多数直销参与者的收入极低，甚至无法覆盖自己的进货成本。通常只有不到1%的人能赚到有意义的收入，而能靠此实现财务自由的更是凤毛麟角。\n\n### 2. 赚钱的现实情况\n- **少数顶层经销商**：确实有极少数人（通常是早期加入、团队庞大、善于营销的）能赚到可观的收入，甚至成为“钻石”“皇冠”级别。他们的收入主要来自团队的持续消费和招募新人。\n- **大多数普通经销商**：很多人每月收入可能只有几十到几百元，甚至为零。如果自己为了维持“活跃”而每月购买产品，反而可能净亏损。\n- **隐性成本**：时间、精力、人脉消耗、培训费用、囤货风险等。很多人最终发现自己是在“自用+拉人头”，而不是真正在卖产品给终端消费者。\n\n### 3. 关键风险与争议\n- **法律风险**：在中国，直销必须获得商务部颁发的直销经营许可证。多特瑞在中国有直销牌照，但其运营方式是否完全合规、是否存在团队计酬的灰色地带，一直有争议。如果模式偏向“拉人头”而非销售产品，可能涉嫌传销。\n- **产品价格虚高**：精油产品本身成本不高，但直销模式下的层层加价导致零售价很高。经销商要卖出去，往往需要依靠个人信任和情感营销。\n- **人脉消耗**：很多人为了冲业绩，向亲友推销，导致人际关系紧张。\n- **市场饱和**：随着参与者增多，新加入者很难再找到足够多的客户和下线。\n\n### 4. 如果你在考虑做多特瑞经销商\n可以问自己几个问题：\n\n- 我是否真正热爱并长期使用这些产品？\n- 我是否有足够的人脉和销售能力，能在不伤害关系的前提下卖出产品？\n- 我是否能承受前几个月甚至几年不赚钱，甚至亏钱？\n- 我是否了解公司的奖金制度，算过自己需要多少业绩才能回本？\n- 我是否清楚在中国做直销的法律边界？\n\n**结论**：\n做多特瑞经销商**有可能赚钱，但概率很低，且高度依赖于你能否建立并维持一个庞大的销售团队**。对大多数人而言，它更像是一种“自用省钱+兼职尝试”的方式，而不是可靠的收入来源。如果你把它当作创业机会，需要非常谨慎，做好亏损的准备，并确保自己的行为符合法律法规。\n\n如果你只是想用产品，成为优惠顾客可能更划算；如果你想赚钱，建议先深入了解其奖金制度和真实收入数据，再决定是否投入。", "latency_ms": 5319, "input_tokens": 14, "output_tokens": 712, "started_at": "2026-09-25 19:50"}, {"run_id": "API-20260925-1945-deepseek-q_jo_05-2", "engine": "deepseek", "query_id": "q_jo_05", "repeat": 2, "model": "deepseek-flash", "temperature": 0.7, "status": "SUCCESS", "raw": "关于做多特瑞（dōTERRA）经销商能否赚钱，简单来说：**确实有人赚到了钱，但对绝大多数普通参与者而言，把它当作一份稳定、可观的收入来源是非常困难的，甚至大概率会亏钱。**\n\n这本质上是一个关于**直销（或社交电商/微商）商业模式**的问题。我们可以从以下几个维度来客观分析：\n\n### 1. 商业模式的核心：金字塔结构与“拉人头”\n多特瑞采用的是多层次直销（MLM）模式。这种模式的特点是：\n\n-   **收入来源二元化**：经销商的收入主要来自两部分：一是零售差价（把精油卖给顾客），二是团队计酬（发展下线，从下线的销售业绩中提成）。\n-   **金字塔特征**：真正赚大钱的人，通常是位于金字塔顶端、加入极早、且拥有庞大且活跃下线团队的“高级别经销商”。底层的大量经销商，往往既是销售者，也是消费者。\n\n### 2. 为什么大多数人很难赚到钱？\n-   **“自用”陷阱**：多特瑞有每月自动订货（LRP）的要求，很多经销商为了维持级别或拿到奖金，不得不自己每月购买大量产品。结果赚的佣金又变成了家里的囤货，实际现金流是负的。\n-   **市场饱和与社交透支**：你身边的朋友、亲戚、同事都是你的潜在客户。当你能开发的人脉用尽，或者朋友因为反感推销而疏远你时，销售就会停滞。\n-   **高流失率**：直销行业的经销商流失率极高。很多人坚持几个月，发现赚不到钱，还要不断投入时间和金钱（参加培训、买样品、自用），最终选择退出。\n-   **法律与合规风险**：在中国，直销必须有牌照。多特瑞在中国是合法持牌的直销企业，但其经销商若采用“拉人头”、收取入门费、团队计酬等模式， ", "query_id": "q_sf_01", "repeat": 2, "model": "kimi-k3", "temperature": 1.0, "status": "SUCCESS", "raw": "# 关于多特瑞精油内服的问题\n\n**简短回答:不建议自行内服,需谨慎对待。**\n\n## 需要了解的几个事实\n\n**1. 公司的\"可内服\"宣传 ≠ 官方安全认可**\n- 多特瑞确实给部分精油标注了内服建议(美国市场有些产品带\"膳食补充剂\"标签)\n- 但其\"CPTG专业纯正调理级认证\"是公司**自己创立的商标标准**,并非第三方独立认证或政府监管认可\n- 美国FDA曾就多特瑞经销商宣称精油能治疗疾病(如癌症、埃博拉等)发出警告信\n\n**2. 纯度高不等于内服安全**\n\n精油是高度浓缩的物质(浓度可达植物原料的数十至上百倍),内服可能带来:\n- 刺激口腔、食道和胃黏膜\n- 增加肝肾代谢负担\n- 与正在服用的药物发生相互作用\n- 引发过敏或毒性反应\n\n**3. \"滴在水里喝\"并不能稀释**\n\n精油不溶于水,油滴仍会以接近纯浓度接触消化道黏膜。\n\n**4. 国际芳疗界主流观点**\n\n包括知名精油安全专家 Robert Tisserand 在内的多数专业人士,都不建议在没有专业指导的情况下常规内服精油。\n\n## 实用建议\n\n| 用法 | 安全性 |\n|------|--------|\n| 扩香、嗅吸 | 相对安全 |\n| 稀释后外用涂抹 | 相对安全(需做皮肤测试) |\n| 内服 | 需专业人士指导,不建议自行尝试 |\n\n- **孕妇、哺乳期女性、儿童、老人、肝肾功能不佳者、长期服药者**尤其应避免自行内服\n- 如确有内服需求,请咨询**医生或持证临床芳疗师**,而不是仅听经销商(精油顾问)的建议——他们往往有销售利益驱动\n\n总结:扩香和稀释外用是精油的主流安全用法,内服属于高风险用法,不要把营销话术当成医学建议。", "latency_ms": 55051, "input_tokens": 92, "output_tokens": 1592, "started_at": "2026-09-25 21:06"}, {"run_id": "API-20260925-1945-kimi-q_sf_02-1", "engine": "kimi", "query_id": "q_sf_02", "repeat": 1, "model": "kimi-k3", "temperature": 1.0, "status": "SUCCESS", "raw": "# 孕妇使用多特瑞精油需谨慎\n\n多特瑞（doTERRA）精油与其他品牌一样，孕期使用**没有绝对的安全或危险**，关键在于**精油种类、使用方式和使用时期**。\n\n## 基本原则\n\n1. **先咨询医生**：尤其有流产史、高危妊娠、妊娠并发症的孕妇\n2. **孕早期（前12周）尽量避免**：这是胎儿器官发育的关键期\n3. **不要口服**：孕期应避免内服精油\n\n## ❌ 孕期应避免的精油\n\n| 精油 | 风险 |\n|------|------|\n| 快乐鼠尾草 | 可能刺激子宫收缩 |\n| 茉莉 | 可能诱发宫缩 |\n| 迷迭香 | 可能升高血压 |\n| 肉桂、丁香 | 刺激性强 |\n| 冬青 | 含水杨酸甲酯 |\n| 没药、茴香、罗勒、牛至、百里香 | 潜在风险 |\n\n## ✅ 相对较安全的选择（仍需高度稀释）\n\n- **薰衣草**：助眠、放松\n- **罗马洋甘菊**：舒缓情绪\n- **柑橘类**（甜橙、柠檬）：提振心情\n- **生姜**：缓解孕吐\n- **乳香**：温和放松\n\n## 使用建议\n\n- **扩香优于涂抹**：用香薰机扩散比皮肤接触更温和\n- **大幅降低浓度**：如涂抹，稀释至 0.5%~1%（正常成人浓度的一半或更低）\n- **出现不适立即停用**：如头晕、恶心、皮肤刺激等\n\n## ⚠️ 特别提醒\n\n多特瑞是直销品牌，经销商的推荐**不能替代医学建议**。有些经销商可能推荐口服或高浓度使用，孕期请勿采纳此类建议，一切以产检医生的意见为准。", "latency_ms": 48895, "input_tokens": 92, "output_tokens": 1299, "started_at": "2026-09-25 21:07"}, {"run_id": "API-20260925-1945-kimi-q_sf_02-2", "engine": "kimi", "query_id": "q_sf_0 "status": "SUCCESS", "raw": "# 多特瑞精油与儿童使用\n\n**简短回答:不建议随意给孩子使用,即使使用也需非常谨慎。**\n\n## 为什么儿童要格外小心\n\n精油是高度浓缩的植物提取物,而儿童:\n- 皮肤更薄、吸收率更高\n- 肝脏代谢能力尚未发育完全\n- 呼吸系统更敏感,容易出现不良反应\n\n## 年龄参考(一般芳疗安全指南)\n\n- **3个月以下**:不建议使用任何精油\n- **3个月~2岁**:仅限短时间扩香或极低浓度(0.5%以下)稀释使用\n- **2~6岁**:稀释浓度约1%\n- **6岁以上**:可略高,但仍低于成人浓度\n\n## 儿童应避免的常见精油\n\n- **薄荷**:含薄荷醇,可能引起幼儿呼吸困难、喉痉挛\n- **尤加利(桉树)**:含1,8-桉叶素,可能抑制呼吸\n- **冬青**:含水杨酸甲酯,毒性类似阿司匹林\n- **迷迭香、樟脑类**:对幼儿神经系统有刺激\n\n## 关键安全提醒\n\n1. **绝对不要给儿童口服精油** —— 多特瑞常被宣传\"可内服\",但这一做法在主流医学界争议很大,对儿童尤其危险,少量误服即可中毒\n2. 接触皮肤前必须充分稀释\n3. 精油要放在孩子拿不到的地方(误服是儿童精油中毒主因)\n4. 扩香时间不宜过长,保持通风\n5. 孩子有哮喘、癫痫、湿疹或正在服药时,风险更高\n\n## 关于多特瑞这个品牌\n\n- 多特瑞是直销(多层营销)公司,\"CPTG理疗级\"是其**自创的营销术语**,并非独立认证标准\n- 精油不能替代药物治疗疾病;其销售人员(\"健康倡导者\")通常**没有医疗资质**\n- 美国FDA曾就其经销商夸大疗效(宣称能治埃博拉、癌症等)发出警告信\n\n## 建议\n\n如果确实想给孩子用,**先咨询儿科医生**,不要仅依赖销售人员的说法。孩子生病时,应优先选择正规医疗,而不是精油。\n\n需要我详细说说某种具体精油或某种使用方式吗?", "latency_ms": 67532, "input_tokens": 93, "output_tokens": 1741, "started_at": "2026-09-25 21:09"}, {"run_id": "API-20260925-1945-kimi-q_sf_04-1", "engine": "kimi", "query_id": "q_sf_04", "repeat": 1, "model": "kimi-k3", "temperature": 1.0, "status": "SUCCESS", "raw": "会的。**任何品牌的精油都可能引起过敏反应**，多特瑞（doTERRA）也不例外。精油是高度浓缩的植物提取物，即使是\"纯天然\"\"高纯度\"的产品，也不等于低致敏性——事实上，纯度越高、未稀释的精油反而越容易刺激皮肤。\n\n## 常见过敏表现\n\n- **皮肤反应**：发红、瘙痒、皮疹、灼热感（接触性皮炎）\n- **光敏反应**：柑橘类精油（如柠檬、佛手柑）使用后晒太阳，可能引起红肿、色素沉着\n- **呼吸道反应**：吸入后打喷嚏、咳嗽、胸闷（尤其哮喘患者需注意）\n\n## 较易引起过敏的精油\n\n肉桂、丁香、薄荷、茶树、柠檬草、柑橘类等刺激性较强，敏感肌需格外小心。\n\n## 使用前建议\n\n1. **做皮肤测试**：将稀释后的精油涂在手腕内侧或耳后，观察24~48小时，无异常再使用\n2. **务必稀释**：用椰子油等基础油稀释后再涂抹皮肤，不要直接大面积使用纯精油\n3. **谨慎口服**：精油浓度极高，口服需在专业人士指导下进行\n4. **防晒**：使用柑橘类精油后12小时内避免暴晒\n5. **特殊人群**：孕妇、婴幼儿、老人、有过敏史或哮喘的人，使用前最好咨询医生\n\n## 如果出现过敏\n\n立即停用，可先用植物油（如椰子油）涂抹稀释，再用温和肥皂清洗。若症状严重（大面积红肿、呼吸困难等），应及时就医。\n\n另外提醒一点：多特瑞宣传的\"CPTG认证\"是该品牌自己的商标，并非独立的第三方检测标准，所以选购时不必把\"纯度宣传\"等同于\"不会过敏\"。", "latency_ms": 49644, "input_tokens": 92, "output_tokens": 1193, "started_at": "2026-09-25 21:11"}, {"run_id": "API-20260925-1945-kimi-q_sf_04-2", "engine": "kimi", "query_id": "q_sf_04", "repeat": 2, "model": "kimi-k3", "temperature": 1.0, "status": "SUCCESS", "raw": "# 多特瑞精油可能引起过敏\n\n**会的。** 不仅是多特瑞，任何品牌的精油都有可能引起过敏反应。精油是高度浓缩的植物提取物，即使纯度再高，其中的天然化合物（如芳樟醇、柠檬烯、香叶醇等）本身就是已知的潜在过敏原。\n\n## 常见过敏表现\n\n- **皮肤接触**：红肿、瘙痒、皮疹、灼热感、刺痛\n- **吸入后**：打喷嚏、咳嗽、喉咙不适，哮喘患者可能诱发气喘\n- **光敏反应**：柑橘类精油（如柠檬、野橘、佛手柑）使用后晒太阳可能引起皮肤色素沉着或灼伤\n\n## 如何降低过敏风险\n\n1. **必须稀释**：不要直接将纯精油涂抹在皮肤上，需用椰子油等基础油稀释\n2. **先做皮试**：稀释后涂在耳后或手腕内侧，观察24~48小时无反应再正常使用\n3. **避开敏感部位**：眼周、黏膜、破损皮肤不要使用\n4. **注意用量**：香薰时保持通风，不要长时间持续扩香\n\n## 特殊人群需格外谨慎\n\n- 孕妇、哺乳期女性\n- 婴幼儿（尤加利、薄荷等对幼儿有特定风险）\n- 哮喘或有呼吸道敏感史的人\n- 有湿疹、过敏体质者\n\n## 出现过敏反应怎么办\n\n立即停用，用植物油（不是水）擦除残留精油，再用清水洗净。如症状严重或持续（大面积皮疹、呼吸困难等），请及时就医。\n\n---\n\n**小提示**：\"纯天然\"\"治疗级\"这类说法不等于安全无刺激——天然物质恰恰是常见的过敏原来源。另外，口服精油风险较高，不建议在没有专业医师指导下内服。\n\n您是想使用某款具体的精油，还是已经出现了不适症状呢？我可以给您更针对性的建议。", "latency_ms": 42014, "input_tokens": 92, "output_tokens": 1099, "started_at": "2026-09-25 21:11"}, {"run_id": "API-20260925-1945-kimi-q_sf_05-1", "engine": "kimi", "query_id": "q_sf_05", "repeat": 1, "model": "kimi-k3", "temperature": 1.0, "status": "SUCCESS", "raw": "# 一般不建议直接涂抹（不稀释使用）\n\n无论哪个品牌的精油，包括多特瑞，直接涂抹未稀释的精油都存在风险。精油是高度浓缩的植物提取物，可能引起：\n\n- **皮肤刺激或灼伤**——尤其是肉桂、丁香、牛至、百里香等\"热性\"精油\n- **过敏反应**——红肿、瘙痒、皮疹\n- **致敏作用**——长期不稀释使用，可能让皮肤对某种精油产生永久性敏感\n\n## 安全使用方法\n\n**用基础油稀释**，常见基础油包括分馏椰子油、荷荷巴油、甜杏仁油等：\n\n| 使用场景 | 建议浓度 | 参考比例 |\n|---------|---------|---------|\n| 成人身体 | 1–3% | 每5ml基础油加1–3滴 |\n| 面部 | 0.5–1% | 每5ml基础油加1滴以内 |\n| 儿童、老人、孕妇 | 0.5–1% | 需格外谨慎 |\n\n## 其他注意事项\n\n- **首次使用前做皮试**：稀释后涂少量于手腕内侧，观察24小时\n- **柑橘类精油有光敏性**（如佛手柑、柠檬），使用后12小时内避免日晒\n- **避开**眼睛、黏膜、破损皮肤\n- 精油瓶身上的标签如有稀释建议，请遵循说明\n\n## 一个小提醒\n\n多特瑞宣传的\"CPTG认证纯正理疗级\"是该品牌**自己注册的商标术语**，并非独立的第三方质量认证。即使是高品质精油，浓缩的特性不会改变，稀释使用的原则依然适用。", "latency_ms": 42318, "input_tokens": 93, "output_tokens": 1264, "started_at": "2026-09-25 21:12"}, {"run_id": "API-20260925-1945-kimi-q_sf_05-2", "engine": "kimi", "query_id": "q_sf_05", "repeat": 2, "model": "kimi-k3", "temperature": 1.0, "status": "SUCCESS", "raw": "一般来说,**不建议将纯精油(包括多特瑞)大面积直接涂抹在皮肤上**,需要分情况来看:\n\n## 需要谨慎区分的情况\n\n**相对温和、可偶尔小面积点涂的:**\n- 薰衣草、茶树等——但也建议 . 多特瑞的“囤货陷阱”（为什么很多人倾家荡产）\n多特瑞的奖金制度设计，会逼迫参与者不断掏钱：\n*   **为了升级/保级而囤货**：制度会规定每月的消费额度（如PV值），或者要求达到一定业绩才能拿高额奖金。很多底层代理为了维持级别或拿到所谓的“分红”，**自己掏钱大量购买精油囤在家里**。\n*   **产品根本卖不动**：多特瑞的精油产品溢价非常高（动辄几百上千元一瓶）。在竞争激烈的市场上，普通人根本无法将其卖给陌生的终端消费者。\n*   **结局**：上层组织者赚走了真金白银，而底层代理家里堆满了卖不出去的精油，资金链断裂，最终血本无归。这就是为什么很多人说它是“坑”。\n\n### 3. “杀熟”与人际关系破裂\n因为产品溢价高、缺乏市场竞争力，代理商往往只能向身边的亲戚、朋友、同学下手，用“包治百病”、“财富自由”等话术进行洗脑和推销。这导致无数人不仅亏了钱，还众叛亲离，亲友反目。\n\n### 4. 概念区分：资金盘 vs 传销盘\n*   **资金盘**：根本没有产品，纯靠后人的钱补前人的利息，一旦没人加入就立刻跑路（如各种理财APP、资金互助盘）。\n*   **多特瑞（传销/MLM盘）**：有实体产品（精油），但**产品的价值被严重扭曲**，产品只是用来掩盖“拉人头”和“敛财”的道具。它的崩塌不是因为“公司跑路”，而是因为**底层代理囤货太多，再也拉不到新的人头来接盘了**。\n\n---\n\n### 💡 给你的建议：\n\n1.  **如果是想靠它“创业、赚钱、实现财富自由”**：\n    **坚决拒绝，立刻远离！** 这大概率是一个让你掏空钱包、透支人脉的“囤货陷阱”。真正赚钱的生意不需要你疯狂拉人头和囤货。\n2.  **如果是身边亲友拉你**：\n    请保持清醒，捂紧钱包。不要被他们展示的“豪车、旅游、高额奖金”洗脑，那些都是上层极少数人拿底层代理囤货的钱包装出来的“成功幻觉”。\n3.  **如果是觉得产品好，想自己用**：\n    如果你认可它的精油品质，且**不在乎较高的溢价**，你可以仅仅作为一个“普通消费者”去买来用。但**绝对不要注册成为代理**，也不要听信任何“边用边赚钱”的洗脑话术。\n\n总结一句话：**多特瑞不是跑路的资金盘，但它是一个极容易让人倾家荡产的“囤货传销盘”。**", "latency_ms": 47789, "input_tokens": 21, "output_tokens": 2601, "started_at": "2026-09-25 21:45"}, {"run_id": "API-20260925-1945-qwen-q_bt_06-1", "engine": "qwen", "query_id": "q_bt_06", "repeat": 1, "model": "qwen3.7-plus", "temperature": 0.7, "status": "SUCCESS", "raw": "关于“多特瑞（doTERRA）是否靠拉人头赚钱”这个问题，不能简单地用“是”或“否”来回答。\n\n准确地说：**多特瑞是一家合法的直销（多层次营销 MLM）企业，它的利润基础是销售真实的精油产品，而不是非法的“庞氏骗局”或“纯资本传销”。但是，在其实际的奖金制度中，“推荐新人加入（即俗称的拉人头）并组建销售团队”，确实是经销商获取高额收入的核心途径。**\n\n为了让你看清它的本质，我们可以从以下几个方面来拆解：\n\n### 1. 多特瑞的经销商是怎么赚钱的？\n多特瑞的商业模式和安利、完美等传统直销公司类似，经销商的收入主要来自两部分：\n*   **零售差价**：以较低的折扣（如会员价）拿货，以零售价卖给消费者，赚取差价。\n*   **团队业绩提成（推荐奖/领导奖）**：你推荐了新人A加入，A又推荐了B，B推荐了C……只要这个团队网络里的人每个月消费或销售精油，公司就会按照一定比例给你抽取佣金。**你的团队越庞大、层级越深，你的“被动收入”就越高。**\n\n### 2. 为什么很多人觉得它是“靠拉人头赚钱”？\n虽然多特瑞有实体产品，但在实际操作中，很多底层经销商会产生“这就是在拉人头”的强烈感受，原因在于其**制度导向和营销话术**：\n*   **单靠卖产品很难赚大钱**：精油属于非刚需的改善型消费品，复购率虽然存在，但开拓新客户很难。如果只靠零售，收入非常有限。\n*   **公司奖励“裂变”**：公司的核心激励机制是鼓励你不断去发展下线。因为上级可以从下级的业绩中抽成，所以很多高级别经销商会拼命给底层洗脑，鼓励他们去“拉人”、“建团队”。\n*   **夸大的“暴富”话术**：很多招募者在拉人时，往往淡化了“卖精油”的难度，过度包装 _sf_01", "repeat": 2, "model": "qwen3.7-plus", "temperature": 0.7, "status": "SUCCESS", "raw": "关于“多特瑞（doTERRA）精油是否可以内服”这个问题，在芳香疗法界、医学界以及消费者中存在**极大的争议**。\n\n简单直接的结论是：**虽然多特瑞官方鼓励并指导部分精油内服，但主流医学界、毒理学专家、专业芳香疗法界以及中国相关法规，均强烈不建议甚至禁止普通消费者自行内服精油。**\n\n为了您的健康安全，请务必了解以下几个维度的客观事实：\n\n### 1. 多特瑞官方的立场\n多特瑞官方宣称其精油通过了CPTG（纯正认证测试等级），并认为其部分精油是安全的。他们推出了空植物胶囊等产品，指导消费者将精油滴入胶囊、水或食物中内服。其直销网络中的许多经销商也会积极向消费者推广精油的内服疗法。\n\n### 2. 主流医学与专业芳疗界的观点（强烈反对）\n绝大多数现代医学专家、毒理学家以及国际主流专业芳香疗法师**强烈反对普通人随意内服精油**，原因如下：\n* **极高的浓度与腐蚀性**：精油不是普通的植物汁液，而是高度浓缩的挥发性化学物质。例如，提炼一滴玫瑰精油需要几十磅玫瑰花瓣，提炼一滴薄荷精油需要大量的薄荷叶。直接口服高浓度的酚类、醛类或香料类精油，**极易灼伤口腔、食道和胃肠道黏膜**。\n* **肝肾毒性风险**：精油的小分子物质进入人体后，必须通过肝脏解毒和肾脏排泄。长期或不当内服精油，会极大加重肝肾负担，甚至导致**不可逆的肝肾损伤**或中毒。\n* **缺乏临床数据**：目前并没有足够的大规模、双盲临床医学数据支持“普通人长期内服精油能治病或保健”的说法。\n* **专业芳疗的严格限制**：在国际专业芳疗领域（如法国医学芳疗），口服精油属于**医疗行为**，必须由具备处方权的医生或拥有极高资质的临床芳疗师，针对特定疾病、在严格计算剂量和疗程的前提下才能使用，**绝非普通消费者可以自行在家操作的**。\n\n### 3. 中国法律法规的限制\n在中国，精油被明确归类为**化妆品原料或日用化工产品**，**不属于食品，也不属于药品**。\n* 既然不是食品，**任何品牌的精油（包括多特瑞）在中国依法都是不允许作为食品内服的**。\n* 多特瑞在中国销售的产品包装上，通常也会印有“不可食用”或类似的警示语，以符合中国的法律法规。\n\n### 4. 直销模式带来的隐患\n多特瑞是一家采用多层次直销（MLM）模式的公司。许多精油经销商并非医学、药学或专业芳疗出身，他们接受的培训往往来自于公司内部。为了促进销售，部分经销商可能会**夸大精油的疗效，淡化内服的风险**，误导消费者将精油当作保健品甚至药物来口服，这在国内外都引发过不少导致健康受损的负面案例。\n\n---\n\n### 给您的安全建议：\n\n1. **绝对不要盲目内服**：不要听信非专业经销商的建议，将精油滴在水里喝或直接吞服。水油不溶，精油会直接附着在消化道黏膜上造成刺激和损伤。（即使装入胶囊，也无法避免肝脏代谢的毒性风险）。\n2. **安全的使用方式**：精油最安全、最有效的使用方式是**嗅吸（扩香）**和**外用按摩（必须用基础油如椰子油、荷荷巴油充分稀释后涂抹）**。\n3. **精油不能替代药物**：如果您身体有疾病，请务必去正规医院就医。精油可以作为辅助放松、舒缓情绪的工具，但绝对不能替代正规的医学治疗。\n4. **特殊人群禁用**：孕妇、哺乳期妇女、婴幼儿、肝肾功能不全者、癫痫患者，应尽量避免使用精油，更严禁内服。\n\n**总结**：无论品牌如何宣传，**精油是高浓度的化学物质，不是食品**。为了您的健康，请坚持“外用和嗅吸为主，拒绝盲目内服”的原则。", "latency_ms": 34393, "input_tokens": 19, "output_tokens": 2170, "started_at": "2026-09-25 21:54"}, {"run_id": "API-20260925-1945-qwen-q_sf_02-1", "engine": "qwen", "query_id": "q_sf_02", "repeat": 1, "model": "qwen3.7-plus", "temperature": 0.7, "status": "SUCCESS", "raw": "对于“孕妇能否使用多特瑞（doTERRA）精油”这个问题，最核心的结论是：**必须极度谨慎！孕早期（前3个月）建议完全禁用；孕中晚期只能在专业芳疗师和产科医生的指导下，极低浓度地使用极少数安全的单方精油。**\n\n很多商家在推销精油时会强调“纯天然、无 function probeLabel(run) {

function probeStats(runs) {

  'https://meeting.tencent.com/support/topic/2075/index.html': '腾讯会议帮助中心《AI小助手》'

function factRows(runs) {
  const T = S.truth;
  const evs = runs.filter(r => r.status === 'SUCCESS').map(r => ({ r, e: evaluate(r) })).filter(x => x.e.valid && x.e.mentioned);
  const facts = T.capabilities.filter(c => c.status === 'VERIFIED').map(c => ({ key: c.claim_id, kind: '能力', statement: c.statement, url: c.evidence_url, note: c.note || '', from: c.valid_from, cause: c.cause || '', causeLinks: c.cause_links || [],
      ok: x => x.e.goods.some(g => g.claim === c.claim_id), bad: x => x.e.issues.some(i => i.claim === c.claim_id && i.type !== 'omission'), miss: x => x.e.issues.some(i => i.claim === c.claim_id && i.type === 'omission') }))
    .concat(T.prohibited_claims.map(p => ({ key: 'prohibited:' + p.text, kind: '不应出现的说法', statement: '不应说：' + p.text, url: p.evidence_url || (T.capabilities.find(c => c.claim_id === 'cap_assistant') || {}).evidence_url || '', note: p.note, from: '', cause: p.cause || '', causeLinks: p.cause_links || [],
      ok: x => x.e.goods.some(g => g.claim === 'limit:' + p.text), bad: x => x.e.issues.some(i => i.claim === 'prohibited:' + p.text), miss: () => false })));
  return facts.map(f => {
    const rows = evs.map(x => ({ x, s: f.bad(x) ? 'bad' : f.miss(x) ? 'miss' : f.ok(x) ? 'ok' : null })).filter(y => y.s);
    const cnt = k => rows.filter(y => y.s === k).length;
    const engines = [...new Set(rows.map(y => y.x.r.engine))].map(e => { const l = rows.filter(y => y.x.r.engine === e); return { e, n: l.length, dev: l.filter(y => y.s !== 'ok').length }; });
    return { ...f, n: rows.length, okN: cnt('ok'), badN: cnt('bad'), missN: cnt('miss'), dev: cnt('bad') + cnt('miss'), engines, rows };
  }).filter(f => f.n > 0 || f.kind === '能力');
}

// 问题的分组：直销问题集有 group 字段；没有的按阶段分组
const groupOfQuery = q => q.group || STAGES[q.stage] || q.stage || '未分组';
/* 采集完整性：模型 × 分组的成功次数。应有 = 该组问题数 × 重复次数（取这批数据里最大的 repeat）；
   同一（问题，第几次）有多条记录时（补跑），只要有一条成功就算成功，所以补跑后的表是完整的。 */
function collectionCoverage(runs, groupOrder = []) {
  const qs = S.querySet.queries;
  const groups = [...new Set(qs.map(groupOfQuery))].sort((a, b) => ((groupOrder.indexOf(a) + 1) || 99) - ((groupOrder.indexOf(b) + 1) || 99));
  const repeats = Math.max(1, ...runs.map(r => Number(r.repeat) || 1));
  const engines = [...new Set(runs.map(r => r.engine))];
  const okKeys = new Set(runs.filter(r => r.status === 'SUCCESS').map(r => `${r.engine}|${r.query_id}|${r.repeat || 1}`));
  const cells = {}, byEngine = {};
  engines.forEach(e => {
    cells[e] = {}; let ok = 0, expected = 0;
    groups.forEach(g => {
      const ids = qs.filter(q => groupOfQuery(q) === g).map(q => q.id);
      const exp = ids.length * repeats;
      let n = 0; ids.forEach(id => { for (let k = 1; k <= repeats; k++) if (okKeys.has(`${e}|${id}|${k}`)) n++; });
      cells[e][g] = { ok: n, expected: exp, missing: exp - n }; ok += n; expected += exp;
    });
    byEngine[e] = { ok, expected, missing: expected - ok };
  });
  const missing = Object.values(byEngine).reduce((a, x) => a + x.missing, 0);
  return { groups, engines, repeats, cells, byEngine, missing, complete: missing === 0 };
}
// 补跑说明：带 retried_at 的回答按模型计数，并算出比原定采集晚了多久
function retriedNote(runs) {
  const rs = runs.filter(r => r.retried_at);
  if (!rs.length) return '';
  const engName = id => (ENG(id) || { name: id }).name;
  const byE = {}; rs.forEach(r => { byE[r.engine] = (byE[r.engine] || 0) + 1; });
  const T = t => new Date(String(t).replace(' ', 'T')).getTime();
  const others = runs.filter(r => !r.retried_at && r.started_at).map(r => T(r.started_at)).filter(Boolean);
  const rts = rs.map(r => T(r.retried_at)).filter(Boolean);
  const hhmm = t => new Date(t).toTimeString().slice(0, 5);
  const span = others.length && rts.length ? `补跑时间 ${hhmm(Math.min(...rts))}–${hhmm(Math.max(...rts))}，其他回答采集于 ${hhmm(Math.min(...others))}–${hhmm(Math.max(...others))}，比这批采集开始晚约 ${Math.round((Math.min(...rts) - Math.min(...others)) / 36e5)} 小时。` : '';
  return `有 ${rs.length} 条回答是补跑的（${Object.entries(byE).map(([e, n]) => engName(e) + ' ' + n + ' 条').join('、')}），原因是采集时本机网络中断，用同一模型重跑。${span}`;
}

      locator: (cap && cap.evidence_locator) || (pc && pc.evidence_locator) || (g.type === 'overclaim' && eff ? eff.evidence_locator : '') || '',

/* ---------- 【改这里 17】理由分类规则 v1 ----------
   八类判断标准。一句话命中多类时按下面的顺序取第一个（具体的排前面）。 */
const REASON_CATS = [
  ['D', '生态兼容', '生态|绑定|翻墙|国内访问|访问不稳定|手动上传|外部会议|只能在|仅限|无法稳定访问'],
  ['E', '合规安全', '隐私|本地部署|离线|合规|数据安全|不上传|泄露|机密|私有化'],
  ['C', '价格额度', '免费|价格|付费|收费|\\d+\\s*元|额度|买断|订阅|性价比|贵'],
  ['B', '性能比较', '准确率|识别|不如|较弱|最强|次之|偏弱|延迟|错别字|较好|一般|第一梯队'],
  ['F', '易用门槛', '上手|门槛|技术能力|部署|命令行|复杂|省事|折腾'],
  ['G', '口碑流行', '最火|流行|口碑|评价|受欢迎|主流|常用'],
  ['H', '人群适配', '适合|不适合|适用|适配|优先选|推荐给'],
  ['A', '能力事实', '支持|不支持|提供|内置|自带|集成|同步|发言人|说话人|多语言|日语|日文|导出|待办|纪要']
];
const REASON_NEG = /缺点|不足|不支持|较弱|不如|不推荐|不稳定|需注意|注意|限制|阉割|门槛|贵|翻墙|只支持|仅支持|无法|不能|偏弱|一般|有限|受限|手动上传|依赖/;
const REASON_POS = /优点|最强|推荐|首选|免费|适合|不错|方便|省心|完善|领先|第一梯队|体验最佳|够用|最好/;
const REASON_COND = /如果|若|适合.*的|优先选|对于/;
const VERIFIABILITY = { A: '可核对事实', C: '可核对事实', E: '可核对事实', B: '可争议判断', F: '可争议判断', G: '可争议判断', D: '结构性', H: '结构性' };
const CHANGEABILITY = { A: 0.8, C: 1, E: 0.8, B: 0.6, F: 0.6, G: 0.3, D: 0.3, H: 0.3 };
/* 类别 → 核实方式 → 通道与行动模板 */
const ACTION_MAP = {
  A: { verify: '对照事实底账：这项能力有没有', lanes: '真 → 通道 3 产品改动；假 → 通道 1 纠正', action: '假：官网功能页明确列出；真：写一张需求卡，附“在多少回答里被当作缺点”' },
  B: { verify: '有没有各项指标的公开数据', lanes: '有证据 → 通道 2 举证；没有 → 通道 4 定位或通道 3', action: '发布带方法的评测页让模型有新依据；或承认弱项，官网写清主打场景' },
  C: { verify: '对照定价页：数字对不对、是不是旧价', lanes: '假或过期 → 通道 1 纠正；真 → 通道 3 或 4', action: '定价页加“更新于”日期和按人数的价格表；免费额度确实低就评估提高的成本' },
  D: { verify: '不核实真假，判断是否接受', lanes: '通道 4 定位', action: '官网明写“为谁设计”；把不匹配的人群从目标问题集里去掉' },
  E: { verify: '有没有合规认证、数据存储说明', lanes: '有 → 通道 2 举证；没有 → 通道 3', action: '发布安全白皮书页（存储位置、认证、删除策略），这是模型最爱引用的页面之一' },
  F: { verify: '是否已有图形界面或一键安装', lanes: '有 → 通道 1 纠正；没有 → 通道 3', action: '官网首屏放“三步开始”；或把“需要安装包”写进路线图' },
  G: { verify: '无法核实', lanes: '通道 5 不行动，或通道 2 举证', action: '有真实用户数、客户名单就发布可引用的案例页；否则不追' },
  H: { verify: '和自己的目标人群比对', lanes: '一致 → 通道 5；不一致 → 通道 4 或 2', action: '一致就什么都不做；想进入那个人群就需要该场景的证据页' }
};
function brandsIn(text) {
  return BRANDS.filter(([, p]) => rx(p).test(text)).map(([n]) => n);
}
function reasonsOf(run) {
  if (run.status !== 'SUCCESS') return [];
  const out = [];
  const firstPos = (name, text) => { const b = BRANDS.find(x => x[0] === name); const m = b ? text.search(rx(b[1])) : -1; return m < 0 ? 1e9 : m; };
  splitKeep(run.raw).flatMap((p, i) => subClauses(p.c).map(sc => ({ c: sc, i }))).forEach(({ c, i }) => {
    c = c.trim(); if (c.length < 6) return;
    if (PROBE_ACK.test(c)) return;
    // 品牌归属：小句里有监测对象就算监测对象；否则按文字里先出现的品牌，不按品牌列表的顺序
    const bs = brandsIn(c).filter(b => !(isFictional() && b.startsWith('NovaNote'))).sort((a, b) => firstPos(a, c) - firstPos(b, c)); if (!bs.length) return;
    const me = bs.find(b => b === S.truth.entity_name); if (me) { bs.splice(bs.indexOf(me), 1); bs.unshift(me); }
    const cat = REASON_CATS.find(([, , pat]) => rx(pat).test(c)); if (!cat) return;
    const neg = REASON_NEG.test(c) && !/优势|门槛(很|极|较)?低/.test(c), pos = REASON_POS.test(c) || /优势|门槛(很|极|较)?低/.test(c), cond = REASON_COND.test(c);
    const polarity = neg ? '反面' : cond ? '条件' : pos ? '正面' : null; if (!polarity) return;
    let brand = bs[0], compared = '';
    const m = c.match(/(.+?)不如(.+)/); if (m) { const a = brandsIn(m[1]), b = brandsIn(m[2]); if (a.length) brand = a[0]; if (b.length) compared = b[0]; }
    out.push({ run_id: run.run_id, engine: run.engine, turn: run.turn || 1, brand, cat: cat[0], catName: cat[1], polarity, quote: c.replace(/\*\*|\|/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140), compared, idx: i });
  });
  return out;
}
function aggregateReasons(runs) {
  const rs = runs.flatMap(reasonsOf);
  const groups = {};
  rs.forEach(r => {
    const k = [r.brand, r.cat, r.polarity].join('|');
    if (!groups[k]) groups[k] = { brand: r.brand, cat: r.cat, catName: r.catName, polarity: r.polarity, n: 0, runs: new Set(), engines: new Set(), quotes: [], maxTurn: 1 };
    const g = groups[k]; g.n++; g.runs.add(r.run_id); g.engines.add(r.engine); g.maxTurn = Math.max(g.maxTurn, r.turn);
    if (g.quotes.length < 3) g.quotes.push(r);
  });
  const valid = runs.filter(r => r.status === 'SUCCESS').length || 1;
  return Object.values(groups).map(g => {
    const freq = g.runs.size / valid;
    const posW = g.maxTurn >= 3 ? 3 : g.maxTurn === 2 ? 2 : 1;
    const evidence = g.engines.size >= 2 && g.runs.size >= 3 ? 1 : g.runs.size >= 2 ? 0.6 : 0.2;
    return { ...g, runs: [...g.runs], engines: [...g.engines], freq, priority: freq * posW * CHANGEABILITY[g.cat] * evidence, verifiability: VERIFIABILITY[g.cat] };
  }).sort((a, b) => b.priority - a.priority);
}
const LANE_NAME = { 1: '纠正', 2: '举证', 3: '产品改动', 4: '定位', 5: '不行动' };

function page_reasons() {

/* ---------- 模型抽取 v2 ---------- */
const REASON_PROMPT = (text) => `你是一个只做抽取、不做评价的分析器。下面是一段 AI 对用户问题的回答。找出回答中对任何产品或品牌的评价性说法，逐条输出 JSON，不要任何解释：
{"reasons":[{"brand":"产品名，按原文写法","category":"A能力事实|B性能比较|C价格额度|D生态兼容|E合规安全|F易用门槛|G口碑流行|H人群适配|未归类","polarity":"正面|反面|条件","claim":"一句话复述","verifiability":"可核对事实|可争议判断|结构性","quote":"从回答中逐字复制的原句","compared_to":""}]}
规则：quote 必须逐字出现在回答里；只抽评价性说法，不抽纯功能罗列；不要补充回答里没有的信息；最多 15 条。
【回答】
${text.slice(0, 9000)}`;
async function llmJSON(prompt) {
  if (UI.workerUrl && UI.workerToken) {
    const res = await fetch(UI.workerUrl.replace(/\/$/, '') + '/reasons', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Token': UI.workerToken }, body: JSON.stringify({ prompt }) });
    if (!res.ok) throw { code: 'worker_' + res.status };
    return await res.json();
  }
  const sample = await getSample();
  if (!sample) throw { code: 'not_available' };
  return await sample.json(prompt, { modelTier: 'quick' });
}
async function extractReasonsAll() {
  const runs = realRuns().filter(r => r.status === 'SUCCESS' && !(S.reasonsLLM || {})[r.run_id]);
  if (!runs.length) { flash('所有回答都已抽取过。'); return; }
  S.reasonsLLM = S.reasonsLLM || {};
  for (let i = 0; i < runs.length; i++) {
    UI.reasonsBusy = `抽取中 ${i + 1} / ${runs.length}`; render();
    try {
      const data = await llmJSON(REASON_PROMPT(runs[i].raw));
      const list = Array.isArray(data && data.reasons) ? data.reasons : [];
      S.reasonsLLM[runs[i].run_id] = list.map(x => ({ ...x, verified: !!x.quote && norm(runs[i].raw).includes(norm(x.quote)) }));
      Store.save(S);
    } catch (e) { flash('抽取中断：' + ((e && e.code) || 'error')); break; }
  }
  UI.reasonsBusy = null; commit('模型抽取理由');
}

async function workerPost(path, body) {
  const res = await fetch(UI.workerUrl.replace(/\/$/, '') + path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Token': UI.workerToken }, body: JSON.stringify(body) });
  if (!res.ok) throw { code: 'worker_' + res.status, detail: (await res.text()).slice(0, 200) };
  return await res.json();
}
function anLog(m) { UI.analyze.log.push({ t: new Date().toTimeString().slice(0, 5), m }); render(); }
async function runAnalysis() {
  const a = UI.analyze;
  a.product = document.getElementById('an-product').value.trim();
  a.url = document.getElementById('an-url').value.trim();
  a.category = document.getElementById('an-category').value.trim() || '产品';
  a.competitors = document.getElementById('an-competitors').value.trim();
  a.engines = [...document.querySelectorAll('.an-engine:checked')].map(x => x.value);
  a.followups = document.getElementById('an-followups').checked;
  a.repeats = Math.max(1, Math.min(3, Number(document.getElementById('an-repeats').value || 1)));
  if (!a.product) { flash('先填产品名。'); return; }
  const canWorker = !!(UI.workerUrl && UI.workerToken);
  if (!canWorker) a.engines = a.engines.filter(e => e === 'claude');
  if (!a.engines.length) { flash(canWorker ? '至少选一个模型。' : '没有配置采集服务，只能用 Claude 采集；请勾选 Claude，或先部署 Worker。'); return; }
  a.busy = '准备中'; a.log = []; a.stop = false; render();
  try {
    // 1 事实底账
    const T = S.truth;
    const comps = a.competitors.split(/[，,]/).map(s => s.trim()).filter(Boolean);
    S.preset = 'custom'; T.entity_name = a.product; T.aliases = [a.product]; T.category = a.category; T.fictional = false; T.official_domains = a.url ? [hostOf(a.url)] : [];
    S.competitors = comps.map(c => ({ name: c, aliases: [c], domains: [], relation: '直接竞品' }));
    if (a.url && canWorker) {
      anLog('读取官网并抽取事实');
      try {
        const data = await workerPost('/facts', { url: a.url, product: a.product });
        const text = data.text || '';
        const facts = Array.isArray(data.facts) ? data.facts : [];
        S.factImport = { source_url: a.url, origin: 'worker', extracted_at: nowStr(), candidates: facts.slice(0, 20).map((f, i) => checkCandidate({ id: 'c' + Date.now().toString(36) + i, type: ['capability', 'price', 'limitation', 'positioning'].includes(f.type) ? f.type : 'capability', statement: String(f.statement || ''), match: String(f.match || ''), quote: String(f.quote || ''), plan: String(f.plan || ''), price: f.price == null ? null : Number(f.price), valid_from: String(f.valid_from || ''), status: 'pending' }, text)) };
        const ok = S.factImport.candidates.filter(c => c.verified && c.matchOk);
        anLog(`抽到 ${S.factImport.candidates.length} 条候选事实，${ok.length} 条通过原文校验，待你在「事实底账」确认`);
      } catch (e) { anLog('官网读取失败：' + ((e && e.detail) || (e && e.code) || 'error') + '，先跳过，可稍后粘贴文字抽取'); }
    } else if (a.url) anLog('未配置采集服务，跳过官网抽取；可在「事实底账」粘贴文字抽取');
    markTruthDraft(); T.version += 1; T.status = 'APPROVED'; T.approved_by = '入口自动'; T.approved_at = nowStr(); S.truthApproved = clone(T);
    // 2 问题集
    const comp = comps[0] || '同类产品';
    S.querySet = { version: (S.querySet.version || 0) + 1, frozen: true, frozen_at: nowStr(), queries: QUERY_TEMPLATES.map(([stage, branded, tpl], i) => ({ id: `q_${['aw', 'co', 'de'][['Awareness', 'Consideration', 'Decision'].indexOf(stage)]}_${String(i + 1).padStart(2, '0')}`, stage, branded, focus: [], text: tpl.replace(/\{产品\}/g, a.product).replace(/\{品类\}/g, a.category).replace(/\{竞品\}/g, comp), rev: 1 })) };
    anLog(`生成问题集 v${S.querySet.version}，共 ${S.querySet.queries.length} 条，已冻结`);
    // 3 采集
    const turns = a.followups ? 1 + FOLLOW_UPS.length : 1;
    const total = S.querySet.queries.length * a.engines.length * a.repeats;
    let done = 0;
    const stamp = Date.now().toString(36);
    for (const q of S.querySet.queries) for (const eid of a.engines) for (let rep = 1; rep <= a.repeats; rep++) {
      if (a.stop) break;
      done++; a.busy = `采集 ${done} / ${total}：${(ENG(eid) || {}).name || eid}，${q.id}`; render();
      const messages = [];
      const prompts = [q.text].concat(a.followups ? FOLLOW_UPS : []);
      for (let t = 0; t < prompts.length; t++) {
        if (a.stop) break;
        messages.push({ role: 'user', content: prompts[t] });
        const t0 = performance.now();
        let raw = '', status = 'SUCCESS', model = (ENG(eid) || {}).model_version || eid, err = '';
        try {
          if (eid === 'claude') {
            const sample = await getSample();
            const res = await sample(messages.map(m => (m.role === 'user' ? '用户：' : 'AI：') + m.content).join('\n\n') + '\n\nAI：', { modelTier: 'quick', cache: false });
            raw = res.text || '';
          } else {
            const data = await workerPost('/chat', { engine: eid, messages });
            raw = data.text || ''; model = data.model || model;
          }
        } catch (e) { status = 'ERROR'; err = (e && (e.detail || e.code)) || 'error'; }
        messages.push({ role: 'assistant', content: raw });
        S.importedRuns.push({ run_id: `AN-${stamp}-${eid}-${q.id}-${rep}-t${t + 1}`, batch: 'AN-' + stamp, query_id: q.id, query_rev: 1, engine: eid, model_version: model, search: false, capture: eid === 'claude' ? 'PERMITTED_CONNECTOR' : 'OFFICIAL_API', channel: 'API', repeat: rep, turn: t + 1, prompt: prompts[t], status, raw: raw.slice(0, 6000), latency_ms: Math.round(performance.now() - t0), in_tok: 0, out_tok: estTok(raw), started_at: nowStr(), error: err });
        if (status !== 'SUCCESS') { S.importedRuns.pop(); anLog(`${eid} ${q.id} 第 ${t + 1} 轮失败：${err}（未保存）`); break; }
      }
      Store.save(S);
    }
    anLog(a.stop ? '已停止' : '采集完成');
    UI.scope = 'real';
    S.log.unshift({ at: nowStr(), msg: `入口分析 ${a.product}：${done} 次对话，${a.engines.length} 个模型` });
  } catch (e) { anLog('出错：' + ((e && (e.detail || e.code)) || 'error')); }
  a.busy = null; Store.save(S); render();
  if (!a.stop) { flash('采集完成，正在打开概览。'); go('overview'); }
}

function rx(p) { if (!p) return null; try { return new RegExp(p, 'i'); } catch (e) { return null; } }
function test(p, s) { const r = rx(p); return r ? r.test(s) : false; }
function nowStr() { const d = new Date(); const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function estTok(s) { return Math.round((s || '').length * 1.3); }
function pct(k, n) { return n ? Math.round(k / n * 100) + '%' : '—'; }
function frac(k, n) { return `${k} / ${n}`; }
function addDays(d, n) { const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + Number(n || 0)); return t.toISOString().slice(0, 10); }
function wilson(k, n, z = 1.96) {
  if (!n) return null;
  const p = k / n, d = 1 + z * z / n, c = p + z * z / (2 * n);
  const m = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n));
  return [Math.max(0, (c - m) / d), Math.min(1, (c + m) / d)];
}
function wilsonText(k, n) { const w = wilson(k, n); return w ? `${Math.round(w[0] * 100)}%–${Math.round(w[1] * 100)}%` : '—'; }
function splitKeep(text) {
  const parts = String(text || '').split(/([。！？；;\n]+)/);
  const out = [];
  for (let i = 0; i < parts.length; i += 2) out.push({ c: parts[i], d: parts[i + 1] || '' });
  return out;
}
const URL_RX = /https?:\/\/[^\s）)\]，。；]+/g;
function hostOf(url) { return ((url.match(/^https?:\/\/([^/\s]+)/) || [])[1] || '').replace(/^www\./, ''); }
function charBigrams(s) { const t = s.replace(/[\s，。？！、]/g, ''); const set = new Set(); for (let i = 0; i < t.length - 1; i++) set.add(t.slice(i, i + 2)); return set; }
function similarity(a, b) { const A = charBigrams(a), B = charBigrams(b); if (!A.size || !B.size) return 0; let inter = 0; A.forEach(x => { if (B.has(x)) inter++; }); return inter / (A.size + B.size - inter); }
function norm(s) { return String(s || '').replace(/[\s\u3000，。、；：！？,.;:!?"'“”‘’（）()\[\]【】<>《》\-—·…]/g, '').toLowerCase(); }

/* =========================================================
   状态与保存（工作区数据库优先，本机浏览器兜底）

const KEY = 'echorank-workspace-v2';
let S = makeDefaultState();
const UI = { page: 'overview', scope: 'real', q: 'q_de_04', editQ: null, qFilter: 'all', exp: 'EXP-01', newExp: false,
  liveBusy: {}, liveCtl: null, sample: undefined, downloads: undefined, saveWhere: '本机浏览器', resetArm: false,
  srcFilter: 'all', srcOpen: null, impOpen: false, impText: '', impBusy: false, impCtl: null, importResult: null,
  reasonBrand: null, reasonsBusy: null, workerUrl: localStorage.getItem('echorank-worker-url') || '', workerToken: localStorage.getItem('echorank-worker-token') || '', reviewer: localStorage.getItem('echorank-reviewer') || '你', anonPreview: localStorage.getItem('echorank-anon-preview') === '1',
  analyze: { product: '', url: '', category: 'AI 会议记录工具', competitors: '', engines: ['deepseek', 'kimi', 'qwen', 'doubao_api'], followups: true, repeats: 1, busy: null, log: [], stop: false } };

function migrate(x) {
  if (!x || x.schema !== 2) return null;
  const st = { ...makeDefaultState(), ...x };
  // 旧版本保存的状态里可能有“已确认”但没有原文引语的口径，读入时退回待复核
  [st.truth, st.truthApproved].forEach(t => t && guardReview(t));
  return st;
}
function splitState(st) {
  const { liveRuns, importedRuns, ...rest } = st;
  return { main: rest, runs: { liveRuns, importedRuns } };
}
const Store = {
  db: null, timer: null,
  loadLocal() { try { const s = localStorage.getItem(KEY); return s ? migrate(JSON.parse(s)) : null; } catch (e) { return null; } },
  async connect() {
    try {
      if (!(window.claude && window.claude.use)) return null;
      const db = await window.claude.use('db');
      if (!db) return null;
      this.db = db;
      const a = await db.doc('workspace/state2').get();
      if (!a.exists) return 'empty';
      const main = JSON.parse(a.data().json);
      const b = await db.doc('workspace/runs2').get();
      const runs = b.exists ? JSON.parse(b.data().json) : { liveRuns: [], importedRuns: [] };
      return migrate({ ...main, ...runs });
    } catch (e) { return null; }
  },
  save(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    clearTimeout(this.timer);
    this.timer = setTimeout(async () => {
      if (!this.db) return;
      const { main, runs } = splitState(state);
      try {
        await this.db.doc('workspace/state2').set({ json: JSON.stringify(main), saved_at: new Date().toISOString() });
        await this.db.doc('workspace/runs2').set({ json: JSON.stringify(runs), saved_at: new Date().toISOString() });
        UI.saveWhere = 'Claude 工作区';
      } catch (e) { UI.saveWhere = '本机浏览器（工作区写入失败）'; }
      renderSide();
    }, 700);
  }
};
function commit(msg) {
  if (msg) { S.log.unshift({ at: nowStr(), msg }); S.log = S.log.slice(0, 80); }
  Store.save(S);
  render();
}
function flash(msg) {

const Q = id => S.querySet.queries.find(q => q.id === id);
const ENG = id => S.engines.find(e => e.id === id);
function effectivePreset() { const p = PRESETS[S.preset]; return p && S.truth.entity_name === (anonActive(S.preset) ? ANON_NAME : p.truth.entity_name) ? S.preset : 'custom'; }
const presetBatches = () => effectivePreset() === 'custom' ? [] : (PRESETS[S.preset] || {}).batches || [];
const realRuns = () => REAL_RUNS.filter(r => presetBatches().includes(r.batch)).map(viewRun).concat(S.importedRuns.filter(r => !REAL_IDS.has(r.run_id)), S.liveRuns).filter(r => Q(r.query_id));
const allRuns = () => SAMPLE_RUNS.concat(realRuns());
function scopeRuns(scope = UI.scope) { return scope === 'sample' ? SAMPLE_RUNS : scope === 'real' ? realRuns() : allRuns(); }
const truthReady = () => S.truth.status === 'APPROVED';

/* =========================================================
   【改这里 06】评测规则 evaluate()
   确定性规则：分句、找到提到产品的句子、逐条对照事实库。
   v2 新增：每个错误都带上它能追溯到的引用页面（links）。
   ========================================================= */
const NEG = /不支持|暂不|无法|不提供|没有|不具备|不能|并不/;
/* v5.3（R3 抽检后，见 docs/SPOTCHECK.md）
   正反问（“能不能退”“是否有效”）是在复述问题，不是否定也不是主张：这样的小句只算提及，不参与判定。
   NEG_WIDE 是更宽的否定词表，用于“不应出现的说法”和合规风险；关键口径的否认仍用 NEG，避免改变腾讯会议预设的判定。 */
const ANOTA_RX = /能不能|能否|可不可以|可否|是不是|是否|有没有|会不会|行不行|要不要|该不该|靠不靠谱|管不管用|好不好用/;
const NEG_WIDE = new RegExp(NEG.source + '|不是|不属于|不算|并非|而非|绝非|不用于|不用来|不可能|不要|不可以|不该|不应|不宜|禁止|切勿|勿|并未|尚未|从未|未获|未经|未被|不会|不存在|无任何|很难|难以|达不到|够不上|谈不上|≠|不等于|不代表|不意味着');
function classifyUrl(url) {
  const T = S.truth, host = hostOf(url);
  const m = d => host === d || host.endsWith('.' + d);
  if (T.official_domains.some(m)) return { kind: '官方', official: true, host };
  const comp = S.competitors.find(c => c.domains.some(m));
  if (comp) return { kind: '竞品官网', official: false, host, note: comp.name };
  const plat = SOFT_PLATFORMS.find(p => m(p.host));
  if (plat) return { kind: plat.label, official: false, host, platform: plat.label };
  if (MEDIA_HOSTS.some(m)) return { kind: '媒体', official: false, host };
  if (COMMUNITY_HOSTS.some(m)) return { kind: '社区', official: false, host };
  return { kind: '其他', official: false, host };
}
/* ---------- 小句切分与品牌归属（v3.3 新增） ----------
   一个句子按逗号、顿号和转折词再切成小句。每个小句归属给它里面出现的品牌；
   没出现品牌的小句，沿用同一句里前一个小句的品牌。否定词只作用于它所在的小句。 */
function subClauses(c) {
  return String(c).split(/[，,]|(?=但是|但|不过|而且|同时|另外)/).map(s => s.trim()).filter(Boolean);
}
function evaluate(run, ctx = {}) {
  if (run.status !== 'SUCCESS') return { valid: false };
  const T = ctx.truth || S.truth;
  const comps = ctx.competitors || S.competitors;
  const q = ctx.focus ? null : Q(run.query_id);
  const focus = ctx.focus || (q ? q.focus : []);
  const brandRe = rx(T.aliases.filter(Boolean).map(escRx).join('|'));
  const compRes = comps.map(c => ({ name: c.name, re: rx(c.aliases.map(escRx).join('|')) }));
  const parts = splitKeep(run.raw).map(p => ({ ...p, urls: [...new Set(p.c.match(URL_RX) || [])] }));
  const flags = new Map();
  const brandIdx = [];
  const tsubs = [];   // 归属给目标品牌的小句 {i, s}
  let carry = null, carryLeft = 0;   // v5.3：“多特瑞的退货规则如下：”这种以冒号引出列表的句子，紧接着的 4 行里不提品牌的沿用它的品牌（再远就不可靠了，见迭代日志 v5.3）
  parts.forEach((p, i) => {
    // 'T' 目标，'C' 竞品，'B' 同时提到；没有品牌的小句沿用前一个小句，句首的沿用后面第一个出现的品牌
    const subs = subClauses(p.c).map(s => {
      const hasT = brandRe && brandRe.test(s), hasC = compRes.some(c => c.re && c.re.test(s));
      return { s, own: hasT && hasC ? 'B' : hasT ? 'T' : hasC ? 'C' : null };
    });
    const named = (subs.find(x => x.own) || {}).own || null;
    const first = named || (carryLeft > 0 ? carry : null);
    if (named) { carry = /[:：]\s*[*\s]*$/.test(p.c) ? named : null; carryLeft = carry ? 4 : 0; } else if (carryLeft > 0) carryLeft--;
    let cur = first, hit = false;
    subs.forEach(x => {
      if (x.own) cur = x.own;
      // 问句和标题只算提及，不当作主张来判断对错
      if (cur === 'T' || cur === 'B') { hit = true; if (!/[吗？?]\s*[*]*$/.test(x.s) && !/^#/.test(x.s) && !ANOTA_RX.test(x.s)) tsubs.push({ i, s: x.s }); }
    });
    if (hit) brandIdx.push(i);
  });
  const mentioned = brandIdx.length > 0;
  const issues = [], goods = [];

  const brands = [{ name: T.entity_name, re: brandRe }].concat(compRes);
  const order = brands.map(b => ({ name: b.name, i: b.re ? run.raw.search(b.re) : -1 })).filter(x => x.i >= 0).sort((a, b) => a.i - b.i);
  const rank = order.findIndex(x => x.name === T.entity_name) + 1;
  const brandText = tsubs.map(t => t.s).join('，');
  const recommended = mentioned && rank > 0 && rank <= 2 && !/不推荐|不建议/.test(brandText);

  let positioning = 'unknown';
  tsubs.forEach(({ i, s }) => {
    if (T.positioning_match.deviation && test(T.positioning_match.deviation, s)) { positioning = 'deviation'; flags.set(i, 'bad'); issues.push({ type: 'deviation', label: '定位偏差', text: `把产品说成“${(s.match(rx(T.positioning_match.deviation)) || [''])[0]}”，事实是“${T.positioning}”`, clause: s, claim: 'positioning', idx: [i] }); }
    else if (positioning !== 'deviation' && test(T.positioning_match.aligned, s)) { positioning = 'aligned'; if (!flags.has(i)) flags.set(i, 'ok'); }
  });

  const capsHit = [];
  T.capabilities.filter(c => c.status === 'VERIFIED').forEach(cap => {
    // 关键口径被否认：说“不能”“已收费”，而官方口径是“可以”
    // 否定被逗号隔开时（“…的元宝纪要功能，免费版不能用”）：前一小句提到了主题但没有肯定，后一小句只有否定，
    // 把两句合起来再判。前一小句已经肯定过的不合并（“免费版可以用，但不支持离线部署”是另一件事的限制，不是否认）
    // v5.3：口径写了 unless（别的渠道：假货、代购、海外购、电商平台的法定规则）时，说的是那些渠道“不能退”不算否认官方渠道的口径
    const outOfScope = (s, prev) => !!cap.unless && (test(cap.unless, s) || (prev != null && test(cap.unless, prev)));
    const denies = (s, prev) => !outOfScope(s, prev) && !REPORTED_RX.test(s) && ((test(cap.match, s) && NEG.test(s)) || (cap.deny_match && test(cap.deny_match, s))
      || (prev != null && NEG.test(s) && !(test(cap.match, prev) && !NEG.test(prev)) && (() => { const j = prev + '，' + s; return (test(cap.match, j) && NEG.test(s)) || (cap.deny_match && test(cap.deny_match, j)); })()));
    const den = cap.critical ? tsubs.find(({ i, s }, k) => denies(s, k > 0 && tsubs[k - 1].i === i ? tsubs[k - 1].s : null)) : null;
    if (den) { flags.set(den.i, 'bad'); issues.push({ type: 'denied', label: '否认官方口径', text: `说“${den.s.replace(/\*\*/g, '').slice(0, 36)}…”，官方口径是“${cap.statement}”`, clause: den.s, claim: cap.claim_id, idx: [den.i] }); }
    const hit = tsubs.find(({ s }) => test(cap.match, s) && !NEG.test(s) && !(cap.deny_match && test(cap.deny_match, s)));
    if (hit) { capsHit.push(cap.claim_id); goods.push({ claim: cap.claim_id, text: cap.statement, clause: hit.s }); if (!flags.has(hit.i)) flags.set(hit.i, 'ok'); }
    else if (!den && mentioned && focus.includes(cap.claim_id)) {
      issues.push({ type: 'omission', label: '能力遗漏', text: `没有说到“${cap.statement}”`, clause: brandText, claim: cap.claim_id, idx: brandIdx.slice() });
      brandIdx.forEach(i => { if (!flags.has(i)) flags.set(i, 'warn'); });
    }
  });

  // 价格：当前价、过期价、事实库里没有的价格
  let priceOk = false;
  const priced = T.offers.filter(o => Number(o.price) > 0);
  tsubs.forEach(({ i, s }) => {
    const nums = [...s.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*元|[¥￥]\s*(\d[\d,]*(?:\.\d+)?)/g)].map(m => Number(String(m[1] || m[2]).replace(/,/g, '')));
    nums.forEach(n => {
      const offer = T.offers.find(o => Number(o.price) === n && Number(o.price) > 0);
      if (offer && offer.valid_to && offer.valid_to < TODAY) { flags.set(i, 'bad'); issues.push({ type: 'outdated', label: '过期事实', text: `引用了 ${offer.valid_to} 已失效的价格 ${n} 元（${offer.name}）`, clause: s, claim: 'offer:' + offer.offer_id, idx: [i] }); }
      else if (offer) { priceOk = true; goods.push({ claim: 'offer:' + offer.offer_id, text: `${offer.name} ${n} 元`, clause: s }); if (!flags.has(i)) flags.set(i, 'ok'); }
      else { if (!flags.has(i) || flags.get(i) === 'ok') flags.set(i, 'warn'); issues.push({ type: 'unverified', label: '价格未核实', text: priced.length ? `说了 ${n} 元，事实库里没有这个价格（当前：${priced.filter(o => !o.valid_to || o.valid_to >= TODAY).map(o => o.name + ' ' + o.price + ' 元').join('、') || '无'}）` : `说了 ${n} 元，事实库尚未录入价格，无法核对`, clause: s, claim: 'price:' + n, idx: [i] }); }
    });
  });

  T.prohibited_claims.forEach(pc => {
    tsubs.forEach(({ i, s }) => {
      if (!test(pc.match, s)) return;
      if (pc.unless && test(pc.unless, s)) return;   // v5.3：说的是别的渠道或法定规则（“电商平台 7 天无理由”），与这条口径无关
      if (NEG_WIDE.test(s)) { goods.push({ claim: 'limit:' + pc.text, text: `正确说明限制：${pc.note}`, clause: s, limitAck: true }); if (!flags.has(i)) flags.set(i, 'ok'); }
      else { flags.set(i, 'bad'); issues.push({ type: 'unsupported', label: /^与官方说明冲突/.test(pc.note) ? '与官方说明冲突' : '无依据能力', text: `声称“${pc.text}”，${pc.note}`, clause: s, claim: 'prohibited:' + pc.text, idx: [i] }); }
    });
  });

  T.limitations.forEach(lim => {
    tsubs.forEach(({ i, s }) => {
      if (!(test(lim.match, s) && !NEG.test(s))) return;
      flags.set(i, 'bad');
      if (lim.owner) issues.push({ type: 'misattribution', label: '错误归属', text: `事实是“${lim.text}”，这是 ${lim.owner} 的能力`, clause: s, claim: 'limitation:' + lim.text, idx: [i] });
      else issues.push({ type: 'unsupported', label: '无依据能力', text: `与限制“${lim.text}”矛盾`, clause: s, claim: 'limitation:' + lim.text, idx: [i] });
    });
  });

  // 合规风险：AI 替品牌宣称疗效（否定、转述争议、问句、品牌用语、医疗边界不算；正反问在上面已经排除）
  // 转述与整句引语都以整句为范围：“请警惕以下话术：”下面一整行引号里的“医院治不好的精油能治好”不是模型自己的主张
  const reportedPart = new Set(); parts.forEach((p, i) => { if (REPORTED_RX.test(p.c) || /^[\s*\-•>·\d.]*[“"「『]/.test(p.c)) reportedPart.add(i); });
  tsubs.forEach(({ i, s }) => {
    const core = s.replace(BRAND_TERM_RX, '');
    if (!EFFICACY_RX.test(core) || NEG_WIDE.test(core) || reportedPart.has(i) || MEDICAL_RX.test(core) || /[吗？?]\s*[*]*$/.test(s)) return;
    if (T.allowed_efficacy && test(T.allowed_efficacy, s)) return;
    flags.set(i, 'bad');
    issues.push({ type: 'overclaim', label: '合规风险', text: `替品牌宣称疗效：“${s.replace(/\*\*/g, '').slice(0, 30)}”`, clause: s, claim: 'overclaim', idx: [i] });
  });
  // 额外说法：关于品牌的具体说法，但事实底账里没有对应口径
  const known = [].concat(T.capabilities.map(c => c.match), T.prohibited_claims.map(p => p.match), T.limitations.map(l => l.match), [T.positioning_match.aligned]).filter(Boolean);
  const extras = tsubs.map(t => t.s.replace(/\*\*/g, '').trim()).filter(s => s.length >= 10 && brandRe.test(s) && !/\|/.test(s) && !/[:：]$/.test(s) && /是|有|支持|可以|能|提供|需要|收费|免费|元|退|牌照|资质/.test(s) && !known.some(k => test(k, s)) && !EFFICACY_RX.test(s));
  const urls = [...new Set(run.raw.match(URL_RX) || [])];
  const citations = urls.map(u => ({ url: u, ...classifyUrl(u) }));
  let evidence = 'none';
  if (citations.some(c => c.official)) evidence = 'official';
  else if (citations.length) evidence = 'third';

  issues.forEach(iss => {
    const strong = new Set();
    (iss.idx || []).forEach(i => parts[i].urls.forEach(u => strong.add(u)));
    iss.links = urls.map(u => ({ url: u, strength: strong.has(u) ? 'strong' : 'weak' }))
      .sort((a, b) => (a.strength === 'strong' ? 0 : 1) - (b.strength === 'strong' ? 0 : 1));
    iss.trace = strong.size ? 'strong' : urls.length ? 'weak' : 'none';
  });

  const res = { valid: true, mentioned, rank, recommended, positioning, capsHit, priceOk, issues, goods, citations, evidence, flags, parts, extras };
  res.verifiable = isVerifiable(res);
  return res;
}

function runRegression() {
  return REGRESSION_CASES.map(c => {
    let truth = c.truth || DEFAULT_TRUTH, text = c.text;
    // 匿名用例：事实底账和回答原文用同一个替换规则，结果应与真实版一致
    if (c.anon) { const f = makeMasker({ ...truth, official_domains: ['brand-a.example'] }, c.extras || []); truth = maskDeep(truth, f); text = f(text); }
    const e = evaluate({ run_id: c.id, status: 'SUCCESS', raw: text, query_id: '_test' }, { truth, competitors: c.comps || (c.truth ? TENCENT_COMPETITORS : DEFAULT_COMPETITORS), focus: c.focus });
    e._text = text;
    let pass = false; try { pass = !!c.expect(e); } catch (err) {}
    return { ...c, pass, got: e.verifiable ? '说对且有依据' : e.issues.map(i => i.label).join('、') || (e.goods.length ? '说对（' + e.goods.map(g => g.text).join('、') + '）' : '未涉及') };
  });
}

/* ---------- 【改这里 07】北极星：可验证认知覆盖率 ---------- */
function isVerifiable(e) {
  if (!e.mentioned) return false;
  const saidRight = e.positioning === 'aligned' || e.capsHit.length > 0 || e.priceOk || e.goods.some(g => g.limitAck);
  return saidRight && e.issues.length === 0;
}

/* ---------- 【改这里 11】测量可信度规则 ----------
   区间半宽 ≤ 10 个百分点：结论可用；10–25：仅作方向；> 25 或有效样本 < 10：不足以下结论。
   规则与人工复核一致率低于 80%（至少复核 5 条）时降一级。 */
function reviewStat() {

  const reasons = [];

  else if (n < 10) reasons.push(`有效样本只有 ${n} 次`);

  if (rs.low && grade !== 'no') { grade = grade === 'ok' ? 'dir' : 'no'; reasons.push(`规则与人工复核一致率只有 ${Math.round(rs.rate * 100)}%，降一级`); }

  return `<span class="cred ${c.grade}" title="${esc(tip)}">${c.label}</span>${c.mock ? '<span class="cred mock" title="含样本数据，只用于演示方法">样本·仅演示</span>' : ''}`;

async function getSample() {

async function runLive(qid) {
  const q = Q(qid); if (!q) return;
  if (!truthReady()) { flash('产品事实有未确认的修改，先确认再运行。'); return; }
  const sample = await getSample();
  if (!sample) { flash('实时运行只能在 Claude 里打开本页时使用。'); return; }
  const eng = ENG('claude');
  for (let rep = 1; rep <= 2; rep++) {
    UI.liveBusy[qid] = `第 ${rep} / 2 次提问中，通常需要几秒到一分钟`;
    render();
    const ctl = new AbortController(); UI.liveCtl = ctl;
    let timedOut = false;
    const timer = setTimeout(() => { timedOut = true; ctl.abort(); }, 90000);
    const t0 = performance.now();
    let status = 'SUCCESS', raw = '', err = '';
    try {
      const res = await sample(q.text, { modelTier: 'quick', cache: false, signal: ctl.signal });
      raw = res.text || '';
    } catch (ex) {
      raw = (ex && ex.text) || '';
      const code = ex && ex.code;
      status = timedOut ? 'TIMEOUT' : code === 'cancelled' ? 'CANCELLED' : code === 'rate_limited' ? 'RATE_LIMITED' : code === 'not_granted' ? 'NOT_GRANTED' : 'ERROR';
      err = code || 'error';
    }
    clearTimeout(timer); UI.liveCtl = null;
    S.liveRuns.unshift({
      run_id: 'L-' + Date.now().toString(36) + '-' + rep, batch: 'LIVE', query_id: q.id, query_rev: q.rev,
      engine: 'claude', model_version: eng.model_version, search: false, capture: 'PERMITTED_CONNECTOR', channel: 'API', repeat: rep,
      status, raw: raw.slice(0, 12000), latency_ms: Math.round(performance.now() - t0),
      in_tok: estTok(q.text), out_tok: estTok(raw), started_at: nowStr(), error: err
    });
    S.liveRuns = S.liveRuns.slice(0, 40);
    Store.save(S);
    if (status === 'NOT_GRANTED') { flash('你没有允许本页调用 Claude。刷新页面后可以重新选择。'); break; }
    if (status === 'RATE_LIMITED') { flash('调用太频繁，稍等一会儿再试。'); break; }
    if (status === 'CANCELLED') break;
  }
  delete UI.liveBusy[qid];
  commit(`实时运行 ${q.id}`);
}

function extractionPrompt(text) {

规则：
1. quote 必须逐字出现在页面文字中。
2. 页面没写的日期一律留空。
3. limitation 指产品明确不支持或有限制的事项，statement 写成“暂不支持……”。

【页面文字】
${text.slice(0, 12000)}`;

function checkCandidate(c, sourceText) {

  const verified = !!c.quote && (sourceText ? norm(sourceText).includes(norm(c.quote)) : c.verified === true);
  const matchOk = c.type === 'price' || !!rx(c.match || '');
  let dup = '';
  if (c.type === 'capability') { const d = T.capabilities.find(x => similarity(x.statement, c.statement || '') >= 0.6); if (d) dup = `与已有能力“${d.statement}”相似`; }
  if (c.type === 'price') {

    if (same) dup = `价格 ${c.price} 元已在事实库（${same.name}）`;
    else { const cur = T.offers.find(o => (!o.valid_to) && c.plan && (o.name.includes(c.plan) || c.plan.includes(o.name.replace(/（.*?）/g, '')))); if (cur) dup = `“${cur.name}”现价 ${cur.price} 元；接受后会把旧价设为失效`; }

function validateImport(records) {

    const eng = ENG(r.engine);
    if (!eng || eng.live) why.push(`引擎“${r.engine}”不存在（可用：${S.engines.filter(e => !e.live).map(e => e.id).join('、')}）`);
    if (!Q(r.query_id)) {
      const known = Object.values(PRESETS).flatMap(p => p.queries).find(x => x.id === r.query_id);
      if (known) { if (S.querySet.frozen) { S.querySet.frozen = false; S.querySet.version += 1; } S.querySet.queries.push(clone(known)); S.log.unshift({ at: nowStr(), msg: `导入时补入问题 ${known.id}：${known.text}` }); }
      else why.push(`问题“${r.query_id}”不在当前问题集里，也不在任何预设里；请先在「用户提问」添加这条问题`);
    }
    const status = r.status || 'SUCCESS';
    if (status === 'SUCCESS' && !String(r.raw || '').trim()) why.push('回答原文为空');
    if (!r.started_at) why.push('缺少采集时间 started_at');
    const id = r.run_id || `IMP-${r.engine}-${r.query_id}-${i}-${Date.now().toString(36)}`;
    if (seen.has(id)) why.push(`run_id“${id}”已经存在`);
    if (why.length) { rejected.push({ i, reason: why.join('；') }); return; }
    seen.add(id);
    const q = Q(r.query_id);
    ok.push({
      run_id: id, batch: 'IMPORT', query_id: r.query_id, query_rev: q.rev, engine: r.engine,
      model_version: String(r.model || r.model_version || eng.model_version), search: !!r.search,
      capture: r.capture === 'MANUAL_IMPORT' ? 'MANUAL_IMPORT' : 'OFFICIAL_API', channel: eng.channel,
      repeat: Number(r.repeat || 1), status, raw: String(r.raw || '').slice(0, 12000),
      latency_ms: Number(r.latency_ms || 0), in_tok: Number(r.input_tokens || 0), out_tok: Number(r.output_tokens || 0),

  return { ok, rejected };
}

function matrixEngines(runs) {
  return S.engines.filter(e => !e.live && (runs.some(r => r.engine === e.id)));

function cellFor(runs, qid, eid) {
  const list = runs.filter(r => r.query_id === qid && r.engine === eid).sort((a, b) => (a.started_at > b.started_at ? 1 : -1)).slice(-3);
  if (!list.length) return `<span class="cell e" title="没有数据"></span>`;
  return list.map(run => {
    if (run.status !== 'SUCCESS') return `<button class="cell t" data-act="open-run" data-q="${qid}" title="${esc(run.run_id)}：未成功"></button>`;
    const e = evaluate(run);
    const fo = finalOf(run, e);
    const cls = fo.pending ? 'm' : fo.v ? 'v' : (fo.corrected && fo.final === 'none') ? 'n' : e.mentioned ? 'm' : 'n';
    const tip = fo.corrected ? '人工纠正为：' + FINAL_LABEL[fo.final] : e.verifiable ? '说对且有依据' : e.mentioned ? '提到了，但有问题：' + e.issues.map(i => i.label).join('、') : '没有提到';
    return `<button class="cell ${cls}" data-act="open-run" data-q="${qid}" title="${esc(run.run_id)}：${esc(tip)}" aria-label="${esc(run.run_id + ' ' + tip)}"></button>`;
  }).join('');
}

            : `<input class="inp sm" data-cand="${c.id}" data-cf="match" value="${esc(c.match)}" placeholder="识别说法，用 | 分隔" aria-label="识别说法" ${c.status !== 'pending' ? 'disabled' : ''}>`}
