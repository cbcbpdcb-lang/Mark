/* ---------- 【改这里 22】官网口径：分类、原文引语与逐条复核 ----------
   status 只决定这条口径参不参与评测；review_status 记录人有没有看过原文确认。
   没有原文引语的口径不能标为“已确认”；已确认的口径改了引语或链接，退回“待复核”。 */
const FACT_CATEGORIES = ['资质与经营主体', '产品事实', '使用与安全', '功效表述边界', '购买与售后', '商业模式说明'];
const FACT_LISTS = [
  { list: 'capabilities', kind: '口径', defCat: '' },
  { list: 'offers', kind: '套餐与价格', defCat: '产品事实' },
  { list: 'prohibited_claims', kind: '不应出现的说法', defCat: '功效表述边界' }
];
const catOf = (list, x) => x.category || (FACT_LISTS.find(f => f.list === list) || {}).defCat || '未分类';
const hasQuote = x => !!String(x.source_quote || '').trim();
const isConfirmed = x => x.review_status === '已确认';
function unconfirm(x) { x.review_status = '待复核'; x.reviewed_by = ''; x.reviewed_at = ''; }
function guardReview(T) {
  let n = 0;
  FACT_LISTS.forEach(({ list }) => (T[list] || []).forEach(x => { if (isConfirmed(x) && !hasQuote(x)) { unconfirm(x); n++; } }));
  return n;
}
function factItems(T) {
  return FACT_LISTS.flatMap(({ list, kind }) => (T[list] || []).map((x, i) => ({ list, kind, i, x, cat: catOf(list, x) })));
}
function factItemTitle(list, x) {
  if (list === 'offers') return `${x.name}${Number(x.price) ? `：${x.price} 元` : ''}`;
  if (list === 'prohibited_claims') return '不应说：' + x.text;
  return x.statement;
}
function factCard({ list, kind, i, x }) {

  const fields = list === 'capabilities' ? `

      </div>

        <label class="small muted">生效日${inp(`${p}.valid_from`, x.valid_from, { sm: 1, type: 'date', label: '生效日' })}</label>

      <div class="grid2" style="margin-top:8px">
        <label class="small muted">说法${inp(`${p}.text`, x.text, { sm: 1, label: '说法' })}</label>
        <label class="small muted">识别用的说法（正则）${inp(`${p}.match`, x.match, { sm: 1, label: '识别说法' })}</label>
      </div>
      <label class="small muted">事实说明${inp(`${p}.note`, x.note, { sm: 1, label: '事实说明' })}</label>`;
  return `<div class="cand ${ok ? '' : q ? '' : 'bad'}">
    <div class="spread"><span><span class="tag">${kind}</span>${ok ? '<span class="tag ok">已确认</span>' : '<span class="tag warn">待复核</span>'}${q ? '' : '<span class="tag bad">缺原文引语</span>'}${list === 'capabilities' && x.status !== 'VERIFIED' ? '<span class="tag">不参与评测</span>' : ''}</span>
      <button class="btn quiet sm danger" data-act="truth-del" data-list="${list}" data-i="${i}">删除</button></div>
    ${fields}
    <label class="small muted" style="display:block;margin-top:8px">官网原文（逐字）<textarea class="inp sm" rows="2" data-path="${p}.source_quote" aria-label="官网原文" placeholder="从官方页面逐字复制；没有原文就不能确认">${esc(x.source_quote || '')}</textarea></label>
    ${x.source_note ? `<div class="small muted" style="margin-top:4px"><b>对话端整理（转述，不能代替原文）</b><br>${esc(x.source_note)}</div>` : ''}
    <div class="grid2">
      <label class="small muted">来源网址${inp(`${p}.evidence_url`, x.evidence_url, { sm: 1, label: '来源网址', ph: 'https://官方页面' })}</label>
      <div class="grid2" style="gap:8px">
        <label class="small muted">核对日期${inp(`${p}.checked_at`, x.checked_at, { sm: 1, type: 'date', label: '核对日期' })}</label>
        <label class="small muted">分类<select class="sel inp sm" data-path="${p}.category" aria-label="口径分类">${['', ...FACT_CATEGORIES].map(c => `<option value="${c}" ${(x.category || '') === c ? 'selected' : ''}>${c || '未分类'}${!c && FACT_LISTS.find(f => f.list === list).defCat ? `（默认：${FACT_LISTS.find(f => f.list === list).defCat}）` : ''}</option>`).join('')}</select></label>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      ${ok ? `<span class="small muted">由${esc(x.reviewed_by || '—')}于 ${esc(x.reviewed_at || '—')} 确认</span><button class="btn sm" data-act="fact-unconfirm" data-list="${list}" data-i="${i}">撤回确认</button>`
        : `<button class="btn sm ${q ? 'primary' : ''}" data-act="fact-confirm" data-list="${list}" data-i="${i}" ${q ? '' : 'disabled title="没有原文引语，不能确认"'}>我已看过原文，确认</button>${q ? '' : '<span class="small muted">先填入官网原文，才能确认。</span>'}`}
      ${extLink(x.evidence_url, '打开原文', 'small')}${x.evidence_locator ? `<span class="small muted">${esc(x.evidence_locator)}</span>` : ''}
    </div>
  </div>`;
}
function factLedger(T) {

  return `
  <h2>官网口径</h2>
  <p class="prose muted">共 ${items.length} 条：已确认 ${nOk}，待复核 ${items.length - nOk}，其中缺原文引语 ${nNoQ}。“参与评测”决定这条口径用不用来判定回答；“已确认”表示有人看过官网原文。待复核的口径照常参与评测，报告里会标出来。</p>

    return `<h3>${esc(cat)} <span class="small muted" style="font-weight:400">${list.length} 条${list.length ? `，已确认 ${list.filter(y => isConfirmed(y.x)).length}` : ''}</span></h3>

  <button class="btn sm" data-act="truth-add" data-list="unresolved">添加未说明的话题</button>`;

}

/* ---------- 运行结果 ---------- */
function renderText(e, raw) {
  if (!e || !e.valid) return esc(raw);
  const brandRe = rx('(' + S.truth.aliases.filter(Boolean).map(escRx).join('|') + ')');
  return e.parts.map((p, i) => {
    let h = esc(p.c);
    if (brandRe) h = h.replace(new RegExp(brandRe.source, 'gi'), m => `<mark class="k-brand">${m}</mark>`);
    const f = e.flags.get(i);
    if (f && p.c.trim()) h = `<mark class="k-${f}">${h}</mark>`;
    return h + esc(p.d);
  }).join('');
}
function linksHtml(iss) {
  if (iss.trace === 'none') return '<div class="links">无法溯源：回答没有引用任何页面，可能来自模型训练数据。</div>';
  return `<div class="links">${iss.links.map(l => {
    const st = srcTag(l.url);
    return `<span style="margin-right:12px"><span class="tag ${l.strength === 'strong' ? 'acc' : ''}">${l.strength === 'strong' ? '同句引用' : '同回答引用'}</span><a data-act="open-source" data-url="${esc(l.url)}">${esc(hostOf(l.url))}</a>${st !== 'normal' ? ` <span class="tag ${STATUS_TAG[st]}">${STATUS_LABEL[st]}</span>` : ''}</span>`;
  }).join('')}</div>`;
}
function respBlock(run) {
  const eng = ENG(run.engine) || { name: run.engine };
  const meta = `<div class="meta"><span>${esc(run.run_id)}</span><span>${esc(CAPTURE_LABEL[run.capture] || run.capture)}</span><span>${CHANNEL_LABEL[run.channel] || ''}</span><span>${esc(run.model_version)}</span>${run.turn ? `<span>第 ${run.turn} 轮</span>` : ''}<span>搜索${run.search ? '开' : '关'}</span>${run.latency_ms ? `<span>${(run.latency_ms / 1000).toFixed(1)} 秒</span>` : ''}<span>${esc(run.started_at)}</span>${run.region ? `<span>${esc(run.region)}</span>` : ''}</div>`;
  if (run.status !== 'SUCCESS') {
    const label = { TIMEOUT: '运行超时', RATE_LIMITED: '被限流', NOT_GRANTED: '未授权', CANCELLED: '已停止', ERROR: '运行出错', REFUSED: '拒答' }[run.status] || run.status;
    return `<div class="resp timeout">${meta}<p><b>${label}</b></p><p class="small muted">不计入指标分母，批次成功率单独统计。重跑时记录为新的运行，不覆盖原记录。</p></div>`;
  }
  const q = Q(run.query_id);
  const stale = q && q.rev !== run.query_rev;
  const promptLine = run.turn > 1 && run.prompt ? `<p class="small muted" style="margin:0 0 6px">追问：${esc(run.prompt)}</p>` : '';
  if (isFictional() && run.capture !== 'MOCK') {
    return `<div class="resp">${meta}${promptLine}<div class="txt">${esc(run.raw)}</div>${isBranded(run) ? probePanel(run) : brandPanel(run)}</div>`;
  }
  const e = truthReady() ? evaluate(run) : null;
  const rv = S.reviews[run.run_id];
  const evHtml = !e ? `<div class="eval muted">产品事实未确认，暂不评测。</div>` : `<div class="eval"><dl>
    <dt>提及</dt><dd>${e.mentioned ? `提到了，排第 ${e.rank} 位${e.recommended ? '，算进入候选' : ''}` : '没有提到'}</dd>
    <dt>定位</dt><dd>${{ aligned: '<span class="tag ok">一致</span>', deviation: '<span class="tag bad">偏差</span>', unknown: '<span class="muted">未涉及</span>' }[e.positioning]}</dd>
    <dt>说对的</dt><dd>${e.goods.map(g => `<span class="tag ok">${esc(g.text)}</span>`).join('') || '<span class="muted">无</span>'}</dd>
    <dt>问题</dt><dd>${e.issues.map(i => { const f = factFor(i.claim); return `<div style="margin-bottom:6px"><span class="tag ${i.type === 'omission' || i.type === 'unverified' ? 'warn' : 'bad'}">${i.label}</span> ${esc(i.text)}${f && f.url ? `<div class="small muted">依据：${extLink(f.url, hostOf(f.url))}${f.from ? '，' + esc(f.from) + ' 起' : ''}</div>` : ''}${linksHtml(i)}</div>`; }).join('') || '<span class="muted">无</span>'}</dd>
    <dt>引用</dt><dd>${e.citations.length ? e.citations.map(c => { const st = srcTag(c.url); return `<div class="small"><span class="tag">${c.kind}</span>${st !== 'normal' && st !== 'official' ? `<span class="tag ${STATUS_TAG[st]}">${STATUS_LABEL[st]}</span>` : ''} <button class="linkbtn small" data-act="open-source" data-url="${esc(c.url)}">${esc(c.url)}</button></div>`; }).join('') : '<span class="muted">没有引用</span>'}</dd>
    <dt>结论</dt><dd>${e.verifiable ? '<span class="tag acc">说对且有依据</span>' : '<span class="muted">不计入可验证覆盖</span>'}</dd>
  </dl>
  <div class="review">
    <span class="small muted">人工复核：</span>
    <button class="btn sm ${rv && rv.verdict === 'agree' ? 'primary' : ''}" data-act="review" data-run="${run.run_id}" data-v="agree">判断无误</button>
    <button class="btn sm ${rv && rv.verdict === 'disagree' ? 'primary' : ''}" data-act="review" data-run="${run.run_id}" data-v="disagree">判断有误</button>
    ${rv ? `<button class="btn quiet sm" data-act="review-clear" data-run="${run.run_id}">撤销</button>` : ''}
  </div>
  ${rv && rv.verdict === 'disagree' ? `<div class="grid2" style="margin-top:8px"><select class="inp sel sm" data-review-final="${run.run_id}" aria-label="正确结论"><option value="">正确结论应该是…</option>${Object.entries(FINAL_LABEL).map(([k, v]) => `<option value="${k}" ${rv.final === k ? 'selected' : ''}>${v}</option>`).join('')}</select><input class="inp sm" data-review-note="${run.run_id}" value="${esc(rv.note || '')}" placeholder="写下哪里判断错了" aria-label="复核说明"></div>${rv.final ? `<p class="small" style="margin:6px 0 0;color:var(--accent)">已纠正为“${FINAL_LABEL[rv.final]}”，概览和各项指标已按你的结论更新。</p>` : ''}` : ''}
  </div>`;
  return `<div class="resp">${meta}${promptLine}${stale ? '<p class="small" style="color:var(--warn)">这条回答对应修改前的问题文本，不能和新版本直接比较。</p>' : ''}<div class="txt">${renderText(e, run.raw)}</div>${evHtml}</div>`;
}

      <div class="cols">

        <div class="col"><h3>Claude 实时</h3><p class="small faint" style="margin:0">真实调用，每次问 2 遍</p>

/* ---------- 认知差异 ---------- */
function page_diff() {
  if (!truthReady()) return `<header class="ph"><h1>认知差异</h1></header>${blockedByTruth()}`;
  const probeMode = isFictional() && UI.scope !== 'sample';
  const runs = probeMode ? SAMPLE_RUNS : scopeRuns();
  const m = metrics(runs);
  const T = S.truth;
  const rows = [];
  const count = pred => m.evs.filter(x => x.e.valid && pred(x.e));
  const example = (list, fn) => { for (const x of list) { const it = fn(x.e); if (it) return { run: x.r, clause: it.clause }; } return null; };
  { const right = count(e => e.positioning === 'aligned'), wrong = count(e => e.issues.some(i => i.type === 'deviation'));
    rows.push({ fact: `定位：${T.positioning}`, right: right.length, wrong: wrong.length, type: wrong.length ? '定位偏差' : '', ex: example(wrong, e => e.issues.find(i => i.type === 'deviation')) }); }
  T.capabilities.forEach(c => {
    const right = count(e => e.capsHit.includes(c.claim_id));
    const wrong = count(e => e.issues.some(i => i.type === 'omission' && i.claim === c.claim_id));
    rows.push({ fact: c.statement, right: right.length, wrong: wrong.length, type: wrong.length ? '能力遗漏' : '', ex: example(wrong, e => e.issues.find(i => i.type === 'omission' && i.claim === c.claim_id)) || example(right, e => e.goods.find(g => g.claim === c.claim_id)) });
  });
  T.offers.filter(o => (!o.valid_to || o.valid_to >= TODAY) && o.price > 0).forEach(o => {
    const right = count(e => e.goods.some(g => g.claim === 'offer:' + o.offer_id));
    const wrong = count(e => e.issues.some(i => i.type === 'outdated'));
    rows.push({ fact: `${o.name} ${o.price} 元`, right: right.length, wrong: wrong.length, type: wrong.length ? '过期事实' : '', ex: example(wrong, e => e.issues.find(i => i.type === 'outdated')) });
  });
  T.prohibited_claims.forEach(p => {
    const right = count(e => e.goods.some(g => g.claim === 'limit:' + p.text));
    const wrong = count(e => e.issues.some(i => i.claim === 'prohibited:' + p.text));
    rows.push({ fact: `不应出现：${p.text}`, right: right.length, wrong: wrong.length, type: wrong.length ? '无依据能力' : '', ex: example(wrong, e => e.issues.find(i => i.claim === 'prohibited:' + p.text)) });
  });
  T.limitations.forEach(l => {
    const wrong = count(e => e.issues.some(i => i.claim === 'limitation:' + l.text));
    rows.push({ fact: l.text, right: null, wrong: wrong.length, type: wrong.length ? (l.owner ? '错误归属' : '无依据能力') : '', ex: example(wrong, e => e.issues.find(i => i.claim === 'limitation:' + l.text)) });
  });
  return `
  <header class="ph"><h1>认知差异</h1>
    <p class="lede">左边是你确认过的事实，右边是 AI 实际怎么说。只看差异，不写总结。</p></header>
  ${probeMode ? '<div class="state info"><h4>这里展示的是方法演示样本</h4><p>真实实验里的 NovaNote 是虚构品牌，没有可对照的事实，所以事实对照只在样本上演示。真实实验的结果见「总览」。</p></div>' : ''}
  ${note('“能力遗漏”和“说错”分开统计：漏说日文是信息没被检索到，属于内容覆盖问题；声称支持离线部署是编造，属于风险问题。两者的处理方式完全不同。')}
  <div class="scroll" style="margin-top:28px"><table class="tbl">
    <thead><tr><th>事实库</th><th>AI 的说法（例句）</th><th class="num">说对</th><th class="num">偏差</th><th>类型</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td style="min-width:180px">${esc(r.fact)}</td>
      <td class="wide">${r.ex ? `“${esc(r.ex.clause.slice(0, 90))}”<br><button class="btn quiet sm" data-act="open-run" data-q="${r.ex.run.query_id}">${esc(r.ex.run.run_id)}</button>` : '<span class="muted">没有相关回答</span>'}</td>
      <td class="num">${r.right === null ? '—' : r.right}</td>
      <td class="num" style="${r.wrong ? 'color:var(--bad)' : ''}">${r.wrong}</td>
      <td>${r.type ? `<span class="tag ${r.type === '能力遗漏' ? 'warn' : 'bad'}">${r.type}</span>` : ''}</td></tr>`).join('')}</tbody>
  </table></div>
  <p class="small muted" style="margin-top:14px">每个错误追溯到了哪个页面，见 <button class="linkbtn" data-act="nav" data-page="sources">信源</button>。</p>`;
}

    <div class="field"><label>回答原文</label><div><textarea class="inp" id="mi-raw" rows="6" placeholder="把 App 的回答完整复制进来，包括它给出的参考链接"></textarea></div></div>

  <h2>导入采集脚本的结果</h2>

    <input type="file" id="ji-file" accept=".json,application/json" aria-label="选择 JSON 文件">

    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="ji-run">校验并导入</button></div>
    ${res ? `<div style="margin-top:14px"><p><b>导入 ${res.ok} 条，拒绝 ${res.rejected.length} 条。</b></p>${res.rejected.length ? `<ul class="reasons">${res.rejected.slice(0, 20).map(r => `<li>第 ${r.i + 1} 条：${esc(r.reason)}</li>`).join('')}</ul>` : ''}</div>` : ''}
  </div>

  <h2>导出问题集给采集脚本</h2>
  <p class="prose muted">把下面的内容保存为 queries.json，放在采集脚本同一个文件夹里。${S.querySet.frozen ? '' : '<span style="color:var(--warn)">问题集还是草稿，建议先冻结再采集。</span>'}</p>
  <textarea class="inp" id="qx-text" rows="8" readonly>${esc(queryExport())}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn" data-act="qx-copy">复制</button>${UI.downloads ? '<button class="btn" data-act="qx-save">保存为 queries.json</button>' : ''}</div>

  <h2>已导入的数据</h2>
  ${S.importedRuns.some(r => r.batch && r.batch.startsWith('AN-')) ? `<p class="small"><button class="btn sm danger" data-act="an-clear">清除入口分析产生的全部记录（${S.importedRuns.filter(r => r.batch && r.batch.startsWith('AN-')).length} 条）</button></p>` : ''}
  <div class="scroll"><table class="tbl">
    <thead><tr><th>引擎</th><th>采集方式</th><th class="num">条数</th><th>最近一次</th><th></th></tr></thead>
    <tbody>${importable.map(e => { const rs = S.importedRuns.filter(r => r.engine === e.id); if (!rs.length) return ''; const last = rs.map(r => r.started_at).sort().pop(); const caps = [...new Set(rs.map(r => CAPTURE_LABEL[r.capture]))].join('、'); return `<tr><td>${esc(e.name)}</td><td class="small">${esc(caps)}</td><td class="num">${rs.length}</td><td class="small muted">${esc(last)}</td><td><button class="btn quiet sm danger" data-act="imp-clear-engine" data-e="${e.id}">清除</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">还没有导入任何数据。</td></tr>'}</tbody>
  </table></div>`;
}

/* ---------- 内容实验 ---------- */
function page_experiments() {
  const exp = S.experiments.find(x => x.id === UI.exp) || S.experiments[0];
  const cmp = exp ? comparability(exp) : null;
  const st = exp ? expBaselineStat(exp) : null;
  const capName = id => (S.truth.capabilities.find(c => c.claim_id === id) || {}).statement || id;
  const retest = exp ? addDays(exp.published_at, exp.wait_days) : '';
  const c = st ? cred(st.hit, st.valid, S.preset === 'novanote') : null;
  return `
  <header class="ph"><h1>内容实验</h1>
    <p class="lede">把一处认知差异变成可以验证的改动：先记下基线，再改内容，等一段时间后用同一套问题复测。</p></header>
  <div class="row" style="margin-top:28px">
    ${S.experiments.map(x => `<button class="btn sm ${exp && x.id === exp.id ? 'primary' : ''}" data-act="exp-sel" data-id="${x.id}">${esc(x.id)}</button>`).join('')}
    <button class="btn sm" data-act="exp-new">新建实验</button>
  </div>
  ${UI.newExp ? `<div class="editor">
    <h3 style="margin-top:0">新建实验</h3>
    <div class="field"><label>标题</label><div><input class="inp" id="ne-title" placeholder="例如：更新定价页，标明当前价格与生效日期"></div></div>
    <div class="field"><label>假设</label><div><textarea class="inp" id="ne-hyp" rows="3" placeholder="因为……，所以做……之后，……会上升"></textarea></div></div>
    <div class="field"><label>观察的能力</label><div><select class="inp sel" id="ne-cap">${S.truth.capabilities.map(c => `<option value="${c.claim_id}">${esc(c.statement)}</option>`).join('')}</select></div></div>
    <div class="field"><label>目标问题</label><div>${S.querySet.queries.map(q => `<label class="switch" style="margin:4px 0"><input type="checkbox" class="ne-q" value="${q.id}"> ${esc(q.text)}</label>`).join('')}</div></div>
    <div class="field"><label>改动的页面</label><div><input class="inp" id="ne-url" placeholder="https://"></div></div>
    <div class="field"><label>等待天数</label><div><input class="inp" id="ne-wait" type="number" value="14" style="max-width:120px"></div></div>
    ${!S.querySet.frozen ? '<p class="small" style="color:var(--warn)">问题集还是草稿，先冻结再建实验。</p>' : ''}
    <div class="row" style="margin-top:14px"><button class="btn primary" data-act="exp-create" ${S.querySet.frozen && truthReady() ? '' : 'disabled'}>创建并记录基线</button><button class="btn" data-act="exp-cancel">取消</button></div>
  </div>` : ''}
  ${exp ? `
  <div class="state"><h4>这个实验现在还不能证明内容改动有效</h4><p>采集脚本调用的是官方 API，并且没有开联网搜索，模型读不到你刚改的页面。改完官网再用同一方式复测，结果变化只能来自模型本身。要验证内容改动，需要一个确实会检索新页面的渠道（开联网的 App 或检索接口），并记录它这次读到了哪些页面。受控检索实验和真实 App 效果要分开表述。</p></div>
  <h2>${esc(exp.id)}　${esc(exp.title)}</h2>
  <div class="field"><label>假设</label><div>${esc(exp.hypothesis)}</div></div>
  <div class="field"><label>观察指标</label><div>“${esc(capName(exp.cap))}”在目标问题中被说对的次数</div></div>
  <div class="field"><label>目标问题</label><div>${exp.target_queries.map(id => { const q = Q(id); return `<div>${esc(id)}　${q ? esc(q.text) : '<span style="color:var(--bad)">已删除</span>'}</div>`; }).join('')}</div></div>
  <div class="field"><label>基线</label><div>批次 ${esc(exp.baseline.batch)}（${esc(exp.baseline.captured)}），问题集 v${exp.baseline.query_set_version}，产品事实 v${exp.baseline.truth_version}<br>
    <b>${st.hit} / ${st.valid}</b> 次有效回答说对了这项能力，95% 区间 ${wilsonText(st.hit, st.valid)}。${credTag(c)}</div></div>
  <div class="field"><label>最小可检测变化</label><div class="muted">基线只有 ${st.valid} 次回答时，复测结果要变化约 ${c.half == null ? '—' : Math.round(c.half * 2)} 个百分点以上，才能和随机波动区分开。复测时每条问题至少多跑几次。</div></div>
  <div class="field"><label>改动</label><div>${inp(`$exp.intervention_url`, exp.intervention_url, { label: '改动页面' })}<div class="hint">内容修改在站外完成，本平台不自动发布任何内容。</div></div></div>
  <div class="field"><label>状态</label><div><select class="inp sel" data-exp-field="status" style="max-width:220px">${['已规划', '内容已发布', '等待期', '已复测'].map(s => `<option ${exp.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div></div>
  <div class="field"><label>发布日期</label><div><input class="inp" type="date" data-exp-field="published_at" value="${esc(exp.published_at)}" style="max-width:200px"></div></div>

  <div class="field"><label>混杂因素</label><div><textarea class="inp" data-exp-field="confounders" rows="2">${esc(exp.confounders)}</textarea></div></div>
  <div class="field"><label>结果</label><div class="muted">${exp.status === '已复测' ? '复测结果需要在真实运行后录入。当前只有样本数据，不能写出“提升了多少”。' : `尚未复测。${retest > TODAY ? `还需等待到 ${retest}。` : '已到复测时间。'}`}</div></div>
  ${note('“最小可检测变化”这一行，是把可信度的思路用到实验上：样本太少时，即使复测数字变好了，也可能只是波动。')}
  <h2>可比性检查</h2>
  <div class="state ${cmp.comparable ? 'ok' : 'bad'}">
    <h4>${cmp.comparable ? '当前条件与基线可比' : '当前条件与基线不可比'}</h4>
    <p>${cmp.comparable ? '现在复测，结果差异才可能归因到内容改动。' : `原因：${cmp.blocking.map(c => c.name).join('、')}发生了变化。恢复这些条件，或者新建实验、重新记录基线。`}</p>
  </div>
  <div class="scroll"><table class="tbl">
    <thead><tr><th>条件</th><th>检查</th><th>说明</th></tr></thead>
    <tbody>${cmp.checks.map(c => `<tr><td>${esc(c.name)}</td><td><span class="tag ${c.level}">${c.level === 'ok' ? '一致' : c.level === 'warn' ? '需重评' : '不一致'}</span></td><td class="small muted">${esc(c.detail)}</td></tr>`).join('')}</tbody>
  </table></div>
  ${exp.id !== 'EXP-01' ? `<button class="btn quiet sm danger" data-act="exp-del" data-id="${exp.id}" style="margin-top:14px">删除这个实验</button>` : ''}
  ` : '<p class="muted">还没有实验。</p>'}`;
}

/* ---------- 评测与边界 ---------- */
function page_evals() {
  const reviews = Object.entries(S.reviews);
  const rs = reviewStat();
  const dis = reviews.filter(([, v]) => v.verdict === 'disagree');
  const runById = id => allRuns().find(r => r.run_id === id);
  return `
  <header class="ph"><h1>评测与边界</h1>
    <p class="lede">平台自己的判断也要被检验：哪些是真的做了、哪些是样本、规则和人工复核差了多少。</p></header>
  <h2>规则判断与人工复核</h2>
  <p class="prose">你已复核 ${rs.n} 条：${rs.agree} 条无误，${dis.length} 条有误${rs.n ? `，一致率 ${pct(rs.agree, rs.n)}` : ''}。${rs.n < 5 ? '复核满 5 条后，这个一致率会开始影响全站的可信度等级。' : rs.low ? '一致率低于 80%，全站可信度等级已降一级。' : ''}</p>
  ${dis.length ? `<div class="scroll"><table class="tbl">
    <thead><tr><th>运行</th><th>你的说明</th><th></th></tr></thead>
    <tbody>${dis.map(([id, v]) => { const r = runById(id); return `<tr><td class="small num">${esc(id)}</td><td class="wide">${esc(v.note || '（未填写原因）')}</td><td>${r ? `<button class="btn quiet sm" data-act="open-run" data-q="${r.query_id}">看原文</button>` : ''}</td></tr>`; }).join('')}</tbody>
  </table></div>` : ''}
  ${note('复核里标为“有误”的就是 Bad Case。完整迭代：原始回答 → 规则错在哪 → 人工标注 → 根因 → 修复 → 在同一批数据上复测，确认没有引入新错误。')}
  <h2>回归测试</h2>
  ${(() => { const rr = runRegression(); return `<p class="prose">${rr.filter(x => x.pass).length} / ${rr.length} 通过。R 开头的是外部评审发现的误判，修复后写成测试；G 开头的是防止修复时把原本对的判断改坏。每次改规则后，这张表会重新计算。</p>
  <div class="scroll"><table class="tbl"><thead><tr><th>编号</th><th>句子</th><th>修复前</th><th>期望</th><th>现在的判断</th><th>结果</th></tr></thead><tbody>${rr.map(x => `<tr><td class="small num">${x.id}</td><td class="wide">${esc(x.text)}</td><td class="small muted">${esc(x.before)}</td><td class="small">${esc(x.want)}</td><td class="small">${esc(x.got)}</td><td><span class="tag ${x.pass ? 'ok' : 'bad'}">${x.pass ? '通过' : '未通过'}</span></td></tr>`).join('')}</tbody></table></div>`; })()}
  ${note('每一个被发现的误判都应该变成一条回归测试。这样“修好了”不靠感觉，而且下次改规则时，能立刻知道有没有把别的地方改坏。')}

  <h2>哪些是真的，哪些是样本</h2>
  <div class="scroll"><table class="tbl">
    <thead><tr><th>部分</th><th>状态</th><th>说明</th></tr></thead>
    <tbody>
      <tr><td>评测规则、指标、可信度等级</td><td><span class="tag ok">真实实现</span></td><td class="muted">确定性规则，任何人拿同一份数据都能复算。</td></tr>
      <tr><td>错误溯源、疑似软文与过期判断</td><td><span class="tag ok">真实实现</span></td><td class="muted">每个判断都列出命中的理由，可以人工覆盖。</td></tr>
      <tr><td>事实底账导入</td><td><span class="tag ok">真实实现</span></td><td class="muted">模型抽取 + 原文逐字校验 + 人工确认，需在 Claude 中打开。</td></tr>
      <tr><td>App 人工导入、脚本结果导入</td><td><span class="tag ok">真实实现</span></td><td class="muted">导入时逐条校验，拒绝的记录说明原因。</td></tr>
      <tr><td>真实批次 R1（DeepSeek、Kimi、千问、豆包 API）</td><td><span class="tag ok">真实调用</span></td><td class="muted">2026-09-24 用官方 API 采集，96 次中 89 次成功，已写入页面。</td></tr>
      <tr><td>Claude 实时运行</td><td><span class="tag ok">真实调用</span></td><td class="muted">在 Claude 里打开时可用。</td></tr>
      <tr><td>DeepSeek、豆包、元宝的样本回答</td><td><span class="tag warn">样本</span></td><td class="muted">人工编写，用来演示各类典型错误，不代表真实模型。</td></tr>
      <tr><td>NovaNote、Lumo、Kairo 及样本信源</td><td><span class="tag warn">虚构</span></td><td class="muted">避免评价真实品牌。可以换成真实产品。</td></tr>
      <tr><td>理由抽取 v1（规则）与行动映射</td><td><span class="tag ok">真实实现</span></td><td class="muted">规则可复算；行动模板需人工核实后使用。</td></tr>
      <tr><td>理由抽取 v2（模型）、输入产品的自动分析</td><td><span class="tag warn">需配置采集服务</span></td><td class="muted">在自己域名上部署 Worker 后可用；Claude 里可用 Claude 演示。</td></tr>
      <tr><td>模型评审（语义一致性）</td><td><span class="tag">未实现</span></td><td class="muted">需要先积累 40 条以上人工标注来校准。</td></tr>
    </tbody>
  </table></div>
  <h2>数据边界</h2>
  <div class="prose"><ul>
    <li>API 结果代表模型本身，不等于同品牌 App 的表现。混元 API 的结果也不等于元宝 App。</li>
    <li>App 结果只接受人工导入，不做界面自动化，不绕过登录、验证码或限流。</li>
    <li>“疑似软文”只是风险提示，不是投毒认定。</li>
    <li>不自动发布内容，不承诺排名提升。回答里的网页文字只当数据，不当指令。</li>
  </ul></div>
  <h2>操作记录</h2>
  <div class="scroll"><table class="tbl"><tbody>${S.log.slice(0, 25).map(l => `<tr><td class="small muted num" style="width:150px">${esc(l.at)}</td><td>${esc(l.msg)}</td></tr>`).join('')}</tbody></table></div>`;
}

const PAGES = { report: page_report, gap: page_gap, case: page_case, overview: page_overview, reasons: page_reasons, changelog: page_changelog, analyze: page_analyze, truth: page_truth, queries: page_queries, runs: page_runs, diff: page_diff, sources: page_sources, import: page_import, experiments: page_experiments, evals: page_evals, learn: page_learn };
function cardify(html) {
  // 把每个 h2 小节包成一张卡片；页头和 h2 之前的内容保持原样
  const idx = html.indexOf('<h2');
  if (idx < 0) return html;
  const head = html.slice(0, idx), rest = html.slice(idx);
  const parts = rest.split(/(?=<h2[\s>])/);
  return head + parts.map(x => `<section class="card">${x}</section>`).join('');
}
function render() {
  _srcCache = null;
  renderSide();
  const keep = document.getElementById('imp-text'); if (keep) UI.impText = keep.value;
  const body = (PAGES[UI.page] || page_overview)();
  const top = `<div class="topbar"><div class="crumb">${PAGE_TITLE[UI.page] || '概览'} <span>／ ${esc(S.truth.entity_name)}</span></div><div class="row">${['overview','runs','diff','sources'].includes(UI.page) ? scopeSwitch() : ''}</div></div>`;
  document.getElementById('main').innerHTML = top + cardify(body);
}
function go(page) {
  if (!PAGES[page]) page = 'overview';

  window.scrollTo(0, 0);
  document.getElementById('main').focus({ preventScroll: true });
}
function setPath(obj, path, value) { const keys = path.split('.'); let o = obj; for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]]; o[keys[keys.length - 1]] = value; }
function parseVal(el) { const k = el.dataset.kind; if (k === 'list') return el.value.split(/[，,]/).map(s => s.trim()).filter(Boolean); if (k === 'num') return Number(el.value || 0); return el.value; }
function markTruthDraft() { if (S.truth.status === 'APPROVED') S.truth.status = 'DRAFT'; }

  if (el.dataset.reviewer) { UI.reviewer = el.value.trim() || '你'; try { localStorage.setItem('echorank-reviewer', UI.reviewer); } catch (err) {} return; }
  if (el.dataset.worker) { if (el.dataset.worker === 'url') { UI.workerUrl = el.value.trim(); localStorage.setItem('echorank-worker-url', UI.workerUrl); } else { UI.workerToken = el.value.trim(); localStorage.setItem('echorank-worker-token', UI.workerToken); } render(); return; }
  if (el.dataset.probeLabel !== undefined) { const id = el.dataset.probeLabel; S.probeLabels = S.probeLabels || {}; if (el.value) S.probeLabels[id] = el.value; else delete S.probeLabels[id]; commit(`复核 ${id}：${el.value ? PROBE_CLASS[el.value] : '恢复初标'}`); return; }
  if (el.dataset.reviewFinal) { const r = S.reviews[el.dataset.reviewFinal]; if (r) { r.final = el.value || null; commit(`人工纠正 ${el.dataset.reviewFinal}：${el.value ? FINAL_LABEL[el.value] : '清除'}`); } return; }
  if (el.dataset.reviewNote) { const r = S.reviews[el.dataset.reviewNote]; if (r) { r.note = el.value; Store.save(S); } return; }
  if (el.dataset.engineSearch !== undefined) { const eng = S.engines[Number(el.dataset.engineSearch)]; eng.search = el.checked; commit(`${eng.name}联网搜索改为${eng.search ? '开' : '关'}`); return; }
  if (el.dataset.srcOv) { const u = el.dataset.srcOv; if (el.value === 'auto') delete S.sourceOverrides[u]; else S.sourceOverrides[u] = el.value; commit(`信源 ${hostOf(u)} 人工判断改为：${el.options[el.selectedIndex].text}`); return; }
  if (el.dataset.srcMeta) { const u = el.dataset.srcMeta; S.sourceMeta[u] = { ...(S.sourceMeta[u] || {}), [el.dataset.mf]: el.value }; commit(); return; }
  if (el.dataset.cand) {
    const c = S.factImport.candidates.find(x => x.id === el.dataset.cand); if (!c) return;
    c[el.dataset.cf] = el.dataset.cf === 'price' ? Number(el.value) : el.value;
    Object.assign(c, checkCandidate(c, UI.impText || null));
    if (!UI.impText) c.verified = c.verified; // 没有原文时保留上次校验结果
    commit(); return;
  }
  if (el.id === 'ji-file' && el.files && el.files[0]) {
    const reader = new FileReader();
    reader.onload = () => { document.getElementById('ji-text').value = String(reader.result || ''); };
    reader.readAsText(el.files[0]); return;
  }
  if (el.dataset.expField) {
    const exp = S.experiments.find(x => x.id === UI.exp) || S.experiments[0];
    const f = el.dataset.expField;
    exp[f] = f === 'wait_days' ? Number(el.value || 0) : el.value;
    commit(f === 'status' ? `${exp.id} 状态改为${el.value}` : ''); return;
  }
  const path = el.dataset.path;
  if (!path) return;
  const val = parseVal(el);
  if (path.startsWith('@')) { setPath(S.competitors, path.slice(1).replace(/^competitors\./, ''), val); markTruthDraft(); commit(); return; }
  if (path.startsWith('#')) { const p = path.slice(1).replace(/^engines\./, ''); setPath(S.engines, p, val); const eng = S.engines[Number(p.split('.')[0])]; commit(`${eng.name}版本改为 ${val}`); return; }
  if (path.startsWith('$')) { const exp = S.experiments.find(x => x.id === UI.exp) || S.experiments[0]; exp.intervention_url = val; commit(); return; }
  setPath(S.truth, path, val);
  // 已确认的口径换了引语或来源，原来的确认不再成立
  const m = path.match(/^(capabilities|offers|prohibited_claims)\.(\d+)\.(source_quote|evidence_url)$/);
  if (m) { const x = S.truth[m[1]][Number(m[2])]; if (isConfirmed(x)) { unconfirm(x); flash('原文或来源改了，这条口径退回“待复核”。'); } }
  guardReview(S.truth); markTruthDraft(); commit();
});
document.addEventListener('input', e => { if (e.target.id === 'imp-text') UI.impText = e.target.value; });
window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if (p && p !== UI.page) go(p); });

(function boot() {
  const local = Store.loadLocal();
  if (local) S = local;
  // 匿名预设：保存的是真实版而当前应显示公开版（或反过来）时，重新载入预设
  { const p = PRESETS[S.preset]; if (p && p.anonymize && [p.truth.entity_name, ANON_NAME].includes(S.truth.entity_name) && effectivePreset() === 'custom') applyPreset(S.preset); }
  UI.scope = realRuns().length ? 'real' : 'sample';
  const p = location.hash.slice(1);
  if (PAGES[p]) UI.page = p;
  render();
  Store.connect().then(res => {
    if (res && res !== 'empty') { S = res; UI.saveWhere = 'Claude 工作区'; if (realRuns().length) UI.scope = 'real'; render(); }
    else if (res === 'empty') { UI.saveWhere = 'Claude 工作区'; Store.save(S); renderSide(); }
  });
  getSample().then(() => { if (UI.page === 'runs' || UI.page === 'truth') render(); });
  (async () => { try { UI.downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { UI.downloads = null; } if (UI.page === 'learn' || UI.page === 'import') render(); })();
})();
</script>
</body>
